# FA-01: KI nimmt Anruf an und Bestellung auf (Lieferung, Abholung, Vorbestellung)

- **Status:** **abgenommen** (Sirat, 2026-09-23) — Einzeldurchsicht Runden 32–33, Kreuzverhör Runde 51 eingearbeitet. Änderungen ab jetzt nur mit Grund und Vermerk in der Mitschrift.
- **Stand:** 2026-09-23

| | |
|---|---|
| **Ziel** | Ein Anrufer bestellt telefonisch zum Liefern, zum Abholen oder als Vorbestellung auf eine Uhrzeit; die KI nimmt auf, nennt die vom System berechnete Summe und die Lieferzeit und legt die Bestellung erst nach ausdrücklicher Bestätigung an. |
| **Akteur** | Anrufer, KI-Assistent |
| **Auslöser** | Ein Anruf erreicht die KI, weil im Laden niemand abgenommen hat (Overflow, [FEST 10]). |
| **Vorbedingungen** | Das Restaurant hat den Anrufmanager KI gebucht und aktiv geschaltet (FA-13). Speisekarte, Öffnungszeiten, Liefergebiet mit Zonen und Lieferzeit (FA-17) sind hinterlegt. Der Anruf ist auf die KI umgeleitet. Ist ein **Annahmestopp** aktiv (FA-23), nimmt die KI die betroffene Bestellart **nicht** regulär an, sondern sagt ab und bietet ggf. eine Vorbestellung an (siehe Ausnahme 3c). |
| **Nachbedingungen** | Bei Bestätigung existiert genau eine neue Bestellung im Status **Eingegangen**, mit Bestellart (Lieferung / Abholung), eingefrorenen Preisen und Artikeltexten, und — falls Vorbestellung — mit Kennzeichnung „Vorbestellung" und Wunschzeit. Bei einer **Erstbestellung** hat die KI gefragt, ob sie sich die **Adresse für die nächste Bestellung merken** soll (Einwilligung, „Weg B"); die **Antwort** ist als **Protokolleintrag** festgehalten (kein Audio, [FEST 13]). Nur bei **„Ja"** wird beim Restaurant ein **Kundeneintrag** (Rufnummer, Name, Adresse) gespeichert — dadurch kann FA-02 (Stammkunde) eintreten; bei **„Nein"** wird **kein** Kundeneintrag angelegt und die Bestellung läuft normal weiter. **Löschfrist vorerst 12 Monate nach der letzten Bestellung.** Alles **vorbehaltlich Bestätigung durch den Anwalt (Q10)** ([ENTSCHIEDEN Sirat 2026-09-21], Mitschrift Runde 17/18, ADR 0007). Ohne Bestätigung existiert keine Bestellung. |

## Ist-Ablauf heute (aus der Mitschrift, Runde 3 und 4)

1. Das Telefon (ein Handy) klingelt; der Kollege am Telefon nimmt ab, fragt „Was darf es sein?" und schreibt von Hand auf: Gerichte, Adresse, Name, ggf. Besonderheiten. Legt auf.
2. Derselbe Kollege rechnet danach von Hand aus, was die Bestellung kostet.
3. Der Preis wird dem Kunden nur auf Wunsch genannt; nach der Lieferzeit fragen rund 90 % der Anrufer, sie wird geschätzt.

> Beim Piloten wird heute *nach* dem Auflegen gerechnet — der Kunde erfährt den Preis am Telefon in der Regel nicht verbindlich (Mitschrift Runde 4). fluvo dreht das um: Das System rechnet, die KI nennt die Summe **immer** vor der Bestätigung ([ENTSCHIEDEN Sirat 2026-09-18], Mitschrift Runde 8).

## Normalablauf (Lieferung)

1. Der Anrufer wird auf die KI umgeleitet.
2. Die KI meldet sich mit einem festen ersten Satz und weist darauf hin, dass ein KI-Assistent spricht.
3. Die **Bestellart** (Lieferung / Abholung / Sonstiges) ist eine **Pflichtangabe**, **keine** Pflichtreihenfolge: Die KI nimmt auf, was der Anrufer in **beliebiger Reihenfolge** sagt (Gerichte, Adresse, Zeit), und **fragt nur nach, was fehlt** ([ENTSCHIEDEN Sirat 2026-09-23], Mitschrift Runde 51 — präzisiert Runde 32/33). Nennt der Anrufer von sich aus eine **Adresse**, ist die Bestellart **Lieferung** — die KI **bestätigt das kurz**, statt es zu erfragen. Sagt der Anrufer nach dem KI-Hinweis **nichts Konkretes**, stellt die KI die Bestellart-Frage „Lieferung, Abholung oder Sonstiges?" (genauer Wortlaut → **K4**). („Abholung" → Ausnahme 3a; „Sonstiges" → Ausnahme 3d; eine Wunschzeit macht daraus eine Vorbestellung → Ausnahme 3b.)
4. Der Anrufer nennt seine Gerichte.
5. Die KI gleicht jeden Wunsch mit der aktuellen Speisekarte des Restaurants ab (Verfügbarkeit, Optionen, Preis). **Extra-Zutaten** („extra Zwiebeln") sind **keine Notiz**, sondern **bepreiste Optionen**: Der Aufpreis je Extra hängt von der **Größe/Variante** des Artikels ab (Betriebsregel in **FA-12**); der **Server** rechnet den Aufpreis, die KI **nennt ihn mit** ([ENTSCHIEDEN Sirat 2026-09-23], Mitschrift Runde 51). Für Anweisungen **ohne** Preisfolge („beim Nachbarn klingeln", „ohne Zwiebeln") gibt es **ein freies Notizfeld je Bestellung**: Die KI nimmt es auf, **liest es in der Zusammenfassung mit vor** und lässt es bestätigen, es steht **auf dem Bon** (FA-06) und ist reine **Weitergabe an Küche/Fahrer** — **keine Zusage**. **Kostenpflichtige Wünsche landen nicht in der Notiz**; die KI verweist auf die bepreiste Option ([ENTSCHIEDEN Sirat 2026-09-23], Mitschrift Runde 51; Längenbegrenzung → K8).
6. Der Anrufer nennt seine **Lieferadresse** — **strukturiert** aus **Straße, Hausnummer, PLZ, Ort/Ortsteil** und **Stockwerk (optional)**; Ort/Ortsteil und Stockwerk sind **eigene Felder**, nicht Teil der Notiz ([ENTSCHIEDEN Sirat 2026-09-23], Mitschrift Runde 51). **Statt** einer Adresse kann der Anrufer einen **bekannten Lieferort** nennen, den das Restaurant kennt („Firma Soundso", „am See wie immer") → **FA-24**: Die KI gleicht ihn mit der **Liste bekannter Lieferorte** ab — **Treffer aus der Liste, kein Raten** — bestätigt den Ort und braucht dann keine Adresse. Ein Stammkunde (FA-02) kann statt einer Adresse einen Ort hinterlegt haben.
7. Die KI lässt prüfen, ob die Adresse im Liefergebiet liegt, und ordnet sie einer Lieferzone zu. Die Zonen sind als **Ortsteile** beschrieben (FA-17); die Zuordnung Adresse → Ortsteil macht das System (Geocoder → Q6) — die **KI rät den Ortsteil nie** ([ENTSCHIEDEN Sirat 2026-09-22], Mitschrift Runde 28 B18; [FEST 8]). Ein **bekannter Lieferort** trägt seine **Zone** aus der Liste (FA-24).
8. Die KI fragt **immer nach dem Namen** des Anrufers und — falls zum Anruf **keine Rufnummer übermittelt** wurde — **nach der Rufnummer** ([ENTSCHIEDEN Sirat 2026-09-21], Mitschrift Runde 15). Die Rufnummer wird gebraucht, damit sie auf dem Bon steht (der Fahrer braucht sie, FA-06/FA-09).
9. Die KI lässt die Gesamtsumme (Artikel + Liefergebühr) vom System berechnen; der Mindestbestellwert wird gegen den **Warenwert** (Artikel **ohne** Liefergebühr) geprüft ([ENTSCHIEDEN Sirat 2026-09-22], Mitschrift Runde 27 B17).

> **Pflichtangaben vor der Zusammenfassung (Schritt 10):** Bevor die KI zusammenfasst, müssen **alle** Pflichtangaben vorliegen — als **Prüfregel**, nicht als starrer Dialogbaum (→ K4): **Bestellart**; **Gerichte** (mit Optionen); bei Lieferung **Adresse oder bekannter Lieferort** (FA-24); **Name**; **Rufnummer**; **Zahlungsmöglichkeit angesagt**; ggf. **Wunschzeit** (Vorbestellung); ggf. **Notiz** ([ENTSCHIEDEN Sirat 2026-09-23], Mitschrift Runde 51). Fehlt etwas, fragt die KI nur das Fehlende nach.

10. Die KI liest dem Anrufer die Bestellung, die vom System berechnete Gesamtsumme, die für die Zone hinterlegte Lieferzeit (FA-17) und — von sich aus — die **Zahlungsmöglichkeit** des Restaurants (Stammdatum: **nur Bar** / **Bar und Karte beim Fahrer**) vor. Fragen dazu beantwortet die KI **nur aus dem Stammdatum**; Sonderhinweise („habe nur einen Fünfziger") gehen in die **Notiz** (Wechselgeld außerhalb des Systems, ADR 0012). Eine **Zahlart je Bestellung** wird im ersten Piloten **nicht** erfasst (ADR 0008 bleibt); das Feld ist im Datenmodell vorgesehen (K5) ([ENTSCHIEDEN Sirat 2026-09-23], Mitschrift Runde 51).
11. Der Anrufer bestätigt die Bestellung ausdrücklich.
12. **Bei einer Erstbestellung** (die Rufnummer ist noch nicht als Kunde hinterlegt) fragt die KI, ob sie sich die **Adresse für die nächste Bestellung merken** soll (Einwilligung, „Weg B"; [ENTSCHIEDEN Sirat 2026-09-21], Mitschrift Runde 17/18, ADR 0007). Den genauen **Wortlaut** legt K4 fest (hier nicht ausformuliert). Die **Antwort** (Ja/Nein) wird als **Protokolleintrag** festgehalten — **kein Audio, kein Volltranskript** ([FEST 13]).
13. Das System legt die Bestellung im Status **Eingegangen** an, friert Preise und Artikeltexte ein und vermerkt die Zustimmung zur Bestellung als Log-Eintrag. **Bei „Ja"** (Schritt 12) wird zusätzlich ein **Kundeneintrag** (Rufnummer, Name, Adresse) gespeichert; **bei „Nein"** wird **kein** Kundeneintrag angelegt — die Bestellung läuft normal weiter (alles vorbehaltlich Anwalt, Q10). Der **Bon wird nicht sofort gedruckt**: Das **Annahme-Gerät signalisiert** die neue Bestellung; der Bon druckt **nach Quittierung** der Annahme (spätestens nach **2 Minuten**) → **FA-06** ([ENTSCHIEDEN Sirat 2026-09-22], Mitschrift Runde 34/35).
14. Die KI bestätigt die Aufnahme, nennt die Lieferzeit noch einmal und beendet das Gespräch.

## Ausnahmeabläufe

- **2a. Rufnummer ist als Stammkunde bekannt** (zweigt von Schritt 2 ab): → **FA-02** (Stammkunden-Erkennung nur per Rufnummer, [FEST 15]).
- **2b. Anrufer spricht eine andere Sprache als Deutsch oder Englisch** (zweigt von Schritt 2 ab): Im Piloten spricht die KI **Deutsch** und **Englisch** und **schaltet auf Englisch um**, wenn der Anrufer erkennbar Englisch spricht (beide Sprachen werden in K4 mit Testanrufen abgenommen). Bei einer **anderen** Sprache bleibt die KI bei **einfachem Deutsch** und bietet **nach dem zweiten Missverständnis** die **Übergabe an einen Menschen** an → **FA-03** (Grund „Sprache"). Die KI **schaltet nie** in eine **nicht abgenommene** Sprache um. Später je Restaurant freischaltbar (Stammdatum) ([ENTSCHIEDEN Sirat 2026-09-23], Mitschrift Runde 51). Endet in: Gespräch auf Deutsch/Englisch (Normalablauf) oder Übergabe an einen Menschen (FA-03).
- **3a. Abholung statt Lieferung** (zweigt von Schritt 3 ab): Der Anrufer wählt bei der Bestellart-Frage **Abholung**. Es wird keine Adresse und keine Liefergebühr erhoben (Schritte 6–7 entfallen). Die KI fragt weiterhin **nach dem Namen** und, falls keine Rufnummer übermittelt wurde, nach der Rufnummer (Schritt 8 gilt auch hier). Die KI nennt die Summe und die **Abholzeit** — ein eigener, je Restaurant eingestellter Wert („Abholung in ca. X Minuten", FA-17, [ENTSCHIEDEN Sirat 2026-09-18], Mitschrift Runde 8). → Bestellart **Abholung**, ein Bon-Exemplar (im ersten Piloten trägt ohnehin **kein** Bon einen Fahrer-QR — der QR kommt mit der Fahrer-App wieder, ADR 0008; bei Lieferung dagegen zwei Exemplare, FA-06). Endet in: Bestellung angelegt, Status **Eingegangen**.
- **3b. Vorbestellung auf eine Zeit** (zweigt von Schritt 3 ab): Der Anrufer nennt zusätzlich zur Bestellart (Lieferung oder Abholung) eine Wunschzeit; diese darf **beliebig weit im Voraus** liegen. Einzige Bedingung: Das Restaurant hat zur Wunschzeit Betrieb (Öffnungszeiten, Ruhetage, Urlaub berücksichtigt — [ENTSCHIEDEN Sirat 2026-09-18], Mitschrift Runde 7, Nachtrag Sirat). Die KI lässt das prüfen. Hat das Restaurant Betrieb: Aufnahme wie Lieferung/Abholung, zusätzlich Kennzeichnung „Vorbestellung" mit Wunschzeit. Bei einer Vorbestellung nennt die KI die **gewünschte Uhrzeit** als Zusage, **nicht** die Zonen-Lieferzeit ([ENTSCHIEDEN Sirat 2026-09-22], Mitschrift Runde 44); fehlt der Zone ein Zeitwert, nennt sie „ca. eine Stunde" (Runde 44). Der Bon wird über **FA-06** ausgegeben — bei dieser KI-Bestellung **nach Quittierung** der Annahme (spätestens nach 2 Minuten, nicht mehr „sofort") — und deutlich als Vorbestellung mit Wunschzeit gekennzeichnet ([ENTSCHIEDEN Sirat 2026-09-18], Bon-Ablauf angepasst Runde 34/35, FA-06). Der genannte Preis ist der **eingefrorene Preis vom Bestelltag** ([ENTSCHIEDEN Sirat 2026-09-22], Mitschrift Runde 33; Briefing §5.2 — Frage wird einmal in FA-12 geführt). Der Bon druckt **einmal** am Anruftag; **am Wunschtag wird kein zweiter Bon gedruckt** ([ENTSCHIEDEN Sirat 2026-09-23], Mitschrift Runde 51). Stattdessen wird die Vorbestellung **am Annahme-Bildschirm angezeigt**, bis sie fällig ist bzw. abgeschlossen wird (Anzeige → FA-05/K10). Endet in: Bestellung angelegt, Status **Eingegangen**, gekennzeichnet als Vorbestellung.
- **3b-i. Kein Betrieb zur Wunschzeit** (zweigt von 3b ab): Die KI teilt mit, dass zu der Zeit kein Betrieb ist (geschlossen, Ruhetag oder Urlaub), und fragt nach einer anderen Zeit. Kommt keine Einigung zustande, **beendet die KI das Gespräch freundlich** — **keine Übergabe an einen Menschen** nur deswegen ([ENTSCHIEDEN Sirat 2026-09-22], Mitschrift Runde 32). Endet in: neue Wunschzeit (zurück zu 3b) oder keine Bestellung, Gespräch beendet.
- **3c. Annahmestopp aktiv** (zweigt von Schritt 3 ab): Ist für das Restaurant ein **Annahmestopp** gesetzt (FA-23), sagt die KI **freundlich ab** und bietet — nur bei Betrieb zur Wunschzeit (FA-18) — eine **Vorbestellung** an. Bei **„keine Lieferung mehr"** nimmt die KI eine **Abholung** weiter regulär an (3a); nur die Lieferung ist gesperrt. Bei **„gar nichts mehr"** wird nichts regulär angenommen ([ENTSCHIEDEN Sirat 2026-09-21], Mitschrift Runde 23; Ausgestaltung → FA-23). Endet in: Abholung/Vorbestellung angelegt oder Gespräch ohne Bestellung.
- **3d. „Sonstiges" (kein Bestell-Anliegen)** (zweigt von Schritt 3 ab): Der Anrufer nennt bei der Bestellart-Frage ein anderes Anliegen (z. B. Änderung/Storno einer bestehenden Bestellung, Beschwerde, Frage zu einer laufenden Bestellung, Wunsch nach einem Menschen). Die KI gibt — soweit erlaubt und aus den Stammdaten möglich — **Auskunft**; alles, was sie nicht selbst erledigen darf, **übergibt sie an einen Menschen** → **FA-03** ([ENTSCHIEDEN Sirat 2026-09-22], Mitschrift Runde 32/33; Wortlaut → K4). Endet in: Auskunft gegeben oder Eskalation (FA-03); keine Bestellung aus diesem Zweig.
- **5a. Artikel nicht verfügbar / „momentan aus"** (zweigt von Schritt 5 ab): Die KI teilt mit, dass der Artikel nicht verfügbar ist, und fragt nach einer Alternative. Endet in: geänderter Bestellung (zurück zu 5) oder Abbruch (FA-04).
- **7a. Adresse außerhalb des Liefergebiets** (zweigt von Schritt 7 ab): Die KI teilt mit, dass nicht dorthin geliefert wird, und bietet **Abholung** an. Bittet der Anrufer um eine **Ausnahme** (dorthin trotzdem liefern), sagt die KI das **nicht selbst zu**, sondern **verbindet an die Annahme** → **FA-03** (Eskalationsgrund „Ausnahme Liefergebiet"); **die Annahme entscheidet** über die Ausnahme (Muster wie bei der Ausnahme Mindestbestellwert, 9a) ([ENTSCHIEDEN Sirat 2026-09-22], Mitschrift Runde 33). Endet in: Bestellart Abholung (3a), Eskalation an die Annahme (FA-03) oder Abbruch (FA-04).
- **7b. Adresse nicht auflösbar** (zweigt von Schritt 7 ab): Findet der Geocoder die genannte Adresse **nicht** (oder ist er nicht erreichbar), fragt die KI **einmal** nach (buchstabieren / Hausnummer / Ortsteil); bei Mehrdeutigkeit nennt sie die **Systemkandidaten** zur Auswahl — **kein Raten** (B18). Klappt es nach dem **zweiten Anlauf** nicht, **verbindet die KI an die Annahme** → **FA-03** (neuer Eskalationsgrund „Adresse nicht auflösbar"); die Annahme legt von Hand an und wählt die Zone (FA-05 4a). Ein **bekannter Lieferort** aus der Liste (FA-24) gilt als aufgelöst und läuft nicht in diesen Zweig. Die KI legt **nie** eine Liefer-Bestellung mit **unaufgelöster** Adresse an ([ENTSCHIEDEN Sirat 2026-09-23], Mitschrift Runde 51). Endet in: aufgelöste Adresse (zurück zu 7) oder Übergabe an die Annahme (FA-03).
- **8a. Keine Rufnummer übermittelt** (zweigt von Schritt 8 ab): Wurde zum Anruf keine Rufnummer übermittelt (unterdrückt oder nicht übertragen), fragt die KI den Anrufer ausdrücklich nach seiner Rufnummer, damit sie auf dem Bon steht (der Fahrer braucht sie, FA-09) ([ENTSCHIEDEN Sirat 2026-09-21], Mitschrift Runde 15). Endet in: Rufnummer erfasst, weiter im Normalablauf.
- **9a. Warenwert unter Mindestbestellwert** (zweigt von Schritt 9 ab): Maßgeblich ist der **Warenwert ohne Liefergebühr** ([ENTSCHIEDEN Sirat 2026-09-22], Mitschrift Runde 27 B17). Liegt er unter dem Mindestbestellwert der Zone, **teilt die KI den Mindestbestellwert mit und fragt, ob der Anrufer etwas dazunehmen möchte**. Will der Anrufer **eine Ausnahme** (unter dem Mindestbestellwert liefern lassen), sagt die KI das **nicht selbst zu**, sondern **verbindet an die Annahme** → **FA-03** (Eskalationsgrund „Ausnahme Mindestbestellwert"); **die Annahme entscheidet** über die Ausnahme ([ENTSCHIEDEN Sirat 2026-09-22], Mitschrift Runde 28 B14). Endet in: ergänzter Bestellung (zurück zu 5), Eskalation an die Annahme (FA-03) oder Abbruch (FA-04).
- **9b. Großbestellung über der Schwelle** (zweigt von Schritt 9 ab): Je Restaurant ist ein **Schwellenwert als Artikelanzahl** hinterlegt (Stammdatum, Startwert im Onboarding, änderbar → FA-20; Zahl → K8). Liegt die Bestellung **über der Schwelle**, hängt der Weg von der Zeit ab ([ENTSCHIEDEN Sirat 2026-09-23], Mitschrift Runde 51): (a) **Sofort-Bestellung über der Schwelle** — die KI nimmt vollständig auf, legt sie aber **nicht selbst an**, sondern **übergibt an die Annahme** → **FA-03** (Grund „Großbestellung"); erreicht sie niemanden, steht die Bestellung als **„Rückruf nötig"** an der Annahme, und es druckt **kein Bon, bis ein Mensch bestätigt**. (b) **Vorbestellung über der Schwelle** mit **ausreichend Vorlauf** — die KI nimmt sie **regulär** an (Normalfall der Praxis), die Annahme sieht sie wie jede Vorbestellung; was „ausreichend Vorlauf" ist, ist eine Zahl für **K8**. Endet in: Übergabe an die Annahme / „Rückruf nötig" (a) oder regulär angelegte Vorbestellung (b).
- **10a. Anrufer will die noch nicht bestätigte Bestellung ändern** (zweigt von Schritt 10 ab): Solange die Bestellung im laufenden Gespräch **noch nicht bestätigt** ist, ist ein Wunsch nach mehr, weniger oder anderen Artikeln normaler Gesprächsverlauf. Die KI passt die Bestellung an und geht **zurück zu Schritt 5** (neue Speisekarten-Abgleichung, neue Summe). Keine Eskalation.
- **10b. Anrufer wünscht einen Rabatt, oder will eine bereits aufgegebene Bestellung ändern/stornieren** (zweigt von Schritt 10 ab): Die KI sagt nichts zu, was Geld kostet ([FEST 11]), und übergibt an einen Menschen → **FA-03**. (Nur der Rabattwunsch und die Änderung/Stornierung einer **bereits angelegten** Bestellung sind Eskalationsgründe, nicht die Änderung der laufenden, noch offenen Bestellung.)
- **11a. Anrufer bestätigt nicht / legt auf** (zweigt von Schritt 11 ab): Es wird keine Bestellung angelegt → **FA-04**.
- **13a. Anlegen scheitert nach der Bestätigung** (zweigt von Schritt 13 ab): Die KI sagt „aufgenommen" **nur nach Systembestätigung**. Jeder Anruf trägt einen **eindeutigen Schlüssel** (Idempotenz als fachliche Regel); ein Wiederholungsversuch erzeugt **keine zweite Bestellung** (K6). Scheitert das Anlegen, wiederholt das System **kurz** (Anzahl/Zeit → K8); gelingt es dann nicht, sagt die KI **ehrlich** „konnte nicht speichern" und **verbindet an die Annahme** → **FA-03** (Grund „technischer Fehler"). Ist niemand erreichbar, sagt die KI „bitte in wenigen Minuten erneut anrufen" — **kein Rückruf-Versprechen**. Der Vorfall ist **rot im Monitoring** (FA-22) ([ENTSCHIEDEN Sirat 2026-09-23], Mitschrift Runde 51). Endet in: Übergabe an die Annahme (FA-03) oder Bitte um erneuten Anruf — **keine** und **keine doppelte** Bestellung.

## Darf nicht

- Die KI legt **keinen** Datensatz in den Bestellungen an, bevor der Anrufer ausdrücklich bestätigt hat ([Briefing §5.4]).
- Die KI rechnet Summen **nicht selbst**; jede genannte Summe kommt vom System ([FEST 8]).
- Die KI sagt **nichts** zu, was Geld kostet — keine Rabatte, keine Stornos ([FEST 11]).
- Die KI **entscheidet nicht selbst** über eine **Ausnahme vom Mindestbestellwert** — sie verbindet an die Annahme, die Annahme entscheidet ([ENTSCHIEDEN Sirat 2026-09-22], Mitschrift Runde 28 B14; [FEST 11]).
- Die KI **entscheidet nicht selbst** über eine **Ausnahme außerhalb des Liefergebiets** — sie sagt ab, bietet Abholung an und verbindet bei Ausnahmewunsch an die Annahme, die entscheidet ([ENTSCHIEDEN Sirat 2026-09-22], Mitschrift Runde 33; [FEST 11]).
- Die KI **rät den Ortsteil** einer Adresse **nicht**; die Zuordnung Adresse → Ortsteil/Zone macht der Geocoder (Q6), nicht das LLM ([ENTSCHIEDEN Sirat 2026-09-22], Mitschrift Runde 28 B18; [FEST 8]).
- Die KI gibt sich **nicht** als Mensch aus; der KI-Hinweis fällt immer ([FEST 14]).
- Es wird **kein** Audio und **kein** dauerhaftes Volltranskript gespeichert ([FEST 13]).
- Eine Vorbestellung außerhalb der Öffnungszeit wird **nicht** als reguläre Bestellung angelegt.
- Der Anrufer zahlt nie einen anderen Preis, als ihm am Telefon genannt wurde (Preisstand vom Gesprächsbeginn, Mitschrift Runde 3).
- Die KI legt **nie** eine Liefer-Bestellung mit einer **unaufgelösten Adresse** oder einem **unauflösbaren Ort** an (weder in der Liste bekannter Lieferorte noch im Kundeneintrag noch beim Geocoder auflösbar) — sie fragt einmal nach und übergibt sonst an die Annahme ([ENTSCHIEDEN Sirat 2026-09-23], Mitschrift Runde 51; 7b, FA-24).
- **Kostenpflichtige** Wünsche landen **nicht in der Notiz**; Extra-Zutaten sind bepreiste Optionen, die KI verweist darauf ([ENTSCHIEDEN Sirat 2026-09-23], Mitschrift Runde 51).
- Die KI sagt **„aufgenommen" nur nach Systembestätigung**; ein Wiederholungsversuch erzeugt **keine zweite** Bestellung (Idempotenz je Anruf) und die KI gibt **kein Rückruf-Versprechen** bei technischem Fehler ([ENTSCHIEDEN Sirat 2026-09-23], Mitschrift Runde 51; 13a).
- Die KI **schaltet nie** in eine **nicht abgenommene** Sprache um; jenseits von Deutsch/Englisch übergibt sie nach dem zweiten Missverständnis an einen Menschen ([ENTSCHIEDEN Sirat 2026-09-23], Mitschrift Runde 51; 2b).
- Bei einer **Sofort-Großbestellung über der Schwelle** druckt **kein Bon**, solange ein Mensch die Bestellung nicht bestätigt hat ([ENTSCHIEDEN Sirat 2026-09-23], Mitschrift Runde 51; 9b).
- Am **Wunschtag** einer Vorbestellung wird **kein zweiter Bon** gedruckt (einmaliger Druck am Anruftag; Anzeige am Annahme-Bildschirm) ([ENTSCHIEDEN Sirat 2026-09-23], Mitschrift Runde 51).

| Summen und Liefergebühr rechnet der Server, nicht das LLM | [FEST] | Briefing §2.8, §5.4 |

| **Bestellart ist Pflichtangabe, keine Pflichtreihenfolge:** die KI nimmt auf, was der Anrufer in beliebiger Reihenfolge sagt, und fragt nur Fehlendes nach; nennt der Anrufer eine Adresse, ist die Bestellart Lieferung (kurz bestätigt); sagt er nichts Konkretes, fragt die KI „Lieferung, Abholung oder Sonstiges?" (Wortlaut → K4); „Sonstiges" führt zu Auskunft oder Übergabe (FA-03) | [ENTSCHIEDEN Sirat 2026-09-23] | Mitschrift Runde 51 (präzisiert Runde 32/33) |
| **Vor der Zusammenfassung (Schritt 10)** müssen alle Pflichtangaben vorliegen (Prüfregel, kein starrer Dialogbaum → K4): Bestellart, Gerichte mit Optionen, bei Lieferung Adresse oder bekannter Lieferort (FA-24), Name, Rufnummer, Zahlungsmöglichkeit angesagt, ggf. Wunschzeit, ggf. Notiz | [ENTSCHIEDEN Sirat 2026-09-23] | Mitschrift Runde 51 |
| **Extra-Zutaten** sind bepreiste **Optionen** (Aufpreis abhängig von Größe/Variante, Regel in FA-12); der Server rechnet den Aufpreis, die KI nennt ihn mit | [ENTSCHIEDEN Sirat 2026-09-23] | Mitschrift Runde 51 |

| FA-01-T26 · Bekannter Lieferort statt Adresse | Anrufer nennt „Firma Soundso" (in der Liste bekannter Lieferorte, FA-24) | KI findet den Ort in der Liste (Treffer, kein Raten), bestätigt ihn, übernimmt dessen Zone; keine Adresse nötig | Ort raten; Liefer-Bestellung mit unauflösbarem Ort | Testanruf + automatisch |
| FA-01-T27 · Adresse nicht auflösbar → Übergabe (7b) | Geocoder findet die Adresse nach zweitem Anlauf nicht; kein bekannter Lieferort | KI fragt **einmal** nach, nennt Kandidaten; ohne Auflösung Übergabe an die Annahme (FA-03 „Adresse nicht auflösbar") | Liefer-Bestellung mit unaufgelöster Adresse anlegen; Ortsteil raten | Testanruf + automatisch |
| FA-01-T28 · Zahlungsmöglichkeit angesagt | Restaurant-Stammdatum „nur Bar"; Anrufer fragt „kann ich mit Karte zahlen?" | KI sagt die Zahlungsmöglichkeit von sich aus in der Zusammenfassung an und antwortet **nur aus dem Stammdatum**; keine Zahlart je Bestellung erfasst | KI sagt eine nicht hinterlegte Zahlart zu; Zahlart je Bestellung im Piloten erfassen | Testanruf + automatisch |
| FA-01-T29 · Großbestellung sofort über Schwelle → Übergabe (9b) | Sofort-Bestellung mit Artikelanzahl über der Schwelle des Restaurants; niemand an der Annahme erreichbar | KI nimmt vollständig auf, legt **nicht** selbst an, übergibt (FA-03 „Großbestellung"); Bestellung „Rückruf nötig", **kein Bon** bis ein Mensch bestätigt | KI legt die Großbestellung selbst an; Bon druckt vor Bestätigung | Testanruf + automatisch |
| FA-01-T30 · Großbestellung als Vorbestellung mit Vorlauf → regulär (9b) | Vorbestellung über der Schwelle, ausreichend Vorlauf (K8) | KI nimmt regulär an; Annahme sieht sie wie jede Vorbestellung | Ablehnung nur wegen der Menge; Übergabe trotz ausreichendem Vorlauf | Testanruf + automatisch |
| FA-01-T31 · Anlegen scheitert nach Bestätigung (13a) | Bestätigung liegt vor, Systemanlage schlägt fehl; danach Wiederholungsanruf mit demselben Anruf-Schlüssel | Nach kurzem Wiederholen ehrliche Absage + Übergabe (FA-03 „technischer Fehler"); **keine** und **keine doppelte** Bestellung; rot im Monitoring (FA-22) | „aufgenommen" ohne Systembestätigung; zweite Bestellung bei Wiederholung; Rückruf-Versprechen | automatisch |
| FA-01-T32 · Englisch → Umschalten | Anrufer spricht erkennbar Englisch | KI schaltet auf Englisch um (in K4 abgenommen) und nimmt regulär auf | Umschalten in eine nicht abgenommene Sprache | Testanruf |
| FA-01-T33 · Andere Sprache → Übergabe (2b) | Anrufer spricht weder Deutsch noch Englisch; zwei Missverständnisse | KI bleibt bei einfachem Deutsch und bietet nach dem zweiten Missverständnis die Übergabe an (FA-03 „Sprache") | Umschalten in eine nicht abgenommene Sprache; endloses Schleifen | Testanruf |
| FA-01-T34 · Vorbestellung: kein zweiter Bon am Wunschtag | KI-Vorbestellung auf einen späteren Tag; Wunschtag bricht an | Bon druckte **einmal** am Anruftag; am Wunschtag **kein** zweiter Bon; Vorbestellung am Annahme-Bildschirm sichtbar (FA-05/K10) | Zweiter automatischer Bon zur Fälligkeit | automatisch |

## Rückverfolgung

- **Prozessschritt:** P? „KI-Gespräch → Bestellung anlegen" (K2 noch offen)
- **Zustandsübergänge:** (kein Vorzustand) → **Eingegangen**
- **Technische Anwendungsfälle:** TU-? (Function Calls `check_menu_item` inkl. bepreiste Extra-Optionen, `resolve_delivery_place` (bekannter Lieferort → FA-24), `validate_address` (strukturiert; Kandidaten bei Nicht-Auflösung, 7b), `get_customer_by_phone`, `create_order` mit **Idempotenzschlüssel je Anruf** (13a), `escalate_to_human` (neue Gründe „Adresse nicht auflösbar", „Großbestellung", „technischer Fehler", „Sprache") — Zuordnung in K7)
- **Verträge / Events:** `order.created` (mit **Notiz**, strukturierter Adresse/Lieferort, Feld Zahlart vorgesehen K5); Kundeneintrag speichern/aktualisieren (vorläufig `customer.upserted`, Rechtsgrundlage/Löschfrist offen → Q10); Zustimmung als Log-Eintrag; **Idempotenzschlüssel je Anruf** (13a, K6); technischer Fehler als Monitoring-Signal (FA-22) (K6 noch offen)
- **Testszenarien:** FA-01-T1 … FA-01-T34 (Tabelle oben)
- **Nachbar-Fälle:** FA-02 (Stammkunde, entsteht durch den hier gespeicherten Kundeneintrag; kann Ort statt Adresse haben), FA-03 (Eskalation, u. a. „Sonstiges" 3d, Ausnahme Mindestbestellwert 9a, Ausnahme Liefergebiet 7a, **„Adresse nicht auflösbar" 7b, „Großbestellung" 9b, „technischer Fehler" 13a, „Sprache" 2b**, „Frage zu laufender Bestellung"), FA-04 (Abbruch), FA-06 (Bon, Notiz + Fahrer-Hinweis; kein zweiter Bon zur Fälligkeit), FA-17 (Lieferzonen/-zeit), FA-20 (Stammdaten: Zahlungsmöglichkeiten, Schwelle Großbestellung, bekannte Lieferorte), FA-22 (Rot: Anlegen scheitert), **FA-24 (bekannte Lieferorte)**, FA-23 (Annahmestopp — KI sagt ab / bietet Vorbestellung, Ausnahme 3c)

## Offene Fragen

> **Beantwortet (Runde 33):** Vorbestellung über einen Preiswechsel hinweg — es gilt der **eingefrorene Preis vom Bestelltag** ([ENTSCHIEDEN Sirat 2026-09-22], Briefing §5.2). Die Frage wird einmal in **FA-12** geführt.

> **Beantwortet (Runde 32):** Passt bei einer Vorbestellung ohne Betrieb zur Wunschzeit keine andere Zeit, **beendet die KI das Gespräch freundlich** — **keine** Übergabe an einen Menschen nur deswegen ([ENTSCHIEDEN Sirat 2026-09-22]).

> **Frage an Anwalt (über Sirat, Q10):** Sirat hat **Weg B** entschieden (KI fragt bei der Erstbestellung um Einwilligung, Löschfrist vorerst 12 Monate) — dies **vorbehaltlich Bestätigung durch den Anwalt**. Trägt die telefonische Einwilligung als Rechtsgrundlage, genügt die 12-Monats-Frist, und reicht der Protokolleintrag (ohne Audio) als Nachweis? (open-questions.md Q10.)

> **Frage an Sirat / Pilot (Fakt, vor Pilotstart erfassen):** Kann der **Fahrer** des Piloten **Karte** annehmen? Davon hängt das Stammdatum „Zahlungsmöglichkeit" ab (nur Bar / Bar und Karte beim Fahrer), das die KI in der Zusammenfassung ansagt ([ENTSCHIEDEN Sirat 2026-09-23, Regel]; Mitschrift Runde 51).

> **Frage an Sirat / Pilot (Fakt, vor Pilotstart erfragen):** Welche **Sprachen** rufen tatsächlich an? Im Piloten spricht die KI Deutsch und Englisch; die Antwort bestimmt, ob und wann weitere Sprachen (Stammdatum) freigeschaltet werden müssen (Mitschrift Runde 51).

## Nicht Teil dieses Anwendungsfalls

- Stammkunden-Erkennung und -Ablauf → FA-02.
- Eskalation an einen Menschen, Änderungs- und Stornowunsch sowie **Fragen zu einer bereits laufenden Bestellung** („Wo bleibt mein Essen?", Eskalationsgrund 6) → FA-03.
- Abbruch vor der Bestätigung → FA-04.
- Bon-Druck → FA-06 (bei Lieferung **zwei Exemplare**, **kein** Fahrer-QR im ersten Piloten, ADR 0008). Küche → FA-07 (**entfällt im Piloten**; die Küche arbeitet auf Papier vom Bon).
- Status-Auskunft, Live-ETA/GPS → V2 ([FEST 12]).
- Bestellung über Website oder von Hand → FA-05.
- **Pflege** der Liste bekannter Lieferorte (Anlegen, Fahrer-Hinweis, Zone) → **FA-24**; hier nur die **Nutzung** durch die KI.

<script type="text/markdown" id="md5" data-title="FA-24 (neu)" data-path="docs/konzept/anwendungsfaelle/FA-24-bekannte-lieferorte.md">
# FA-24: Bekannte Lieferorte pflegen und nutzen

- **Status:** Entwurf (aus Kreuzverhör FA-01, Runde 51) — mit Sirat noch nicht einzeln durchgegangen
- **Stand:** 2026-09-23

| | |
|---|---|
| **Ziel** | Das Restaurant pflegt eine Liste von Orten, die Anrufer statt einer Straße nennen („Firma Soundso", „am See wie immer", „Baustelle Hauptstraße"), sodass die KI und die Annahme diese Orte **wiedererkennen** und eine Lieferung **ohne erneutes Erfragen der Adresse** aufnehmen können. |
| **Akteur** | Inhaber, Annahme, KI-Assistent |
| **Auslöser** | Der Inhaber oder die Annahme legt einen bekannten Lieferort an bzw. speichert ihn aus einem Anruf; **oder** ein Anrufer nennt im Gespräch einen Ort statt einer Adresse (Nutzung durch die KI, FA-01 Schritt 6/7). |
| **Vorbedingungen** | Das Restaurant ist angelegt, Liefergebiet mit Zonen (FA-17) ist hinterlegt. Der Bearbeiter ist angemeldet (Inhaber per E-Mail-Link; Annahme per PIN + registriertes Gerät). |
| **Nachbedingungen** | In der Liste bekannter Lieferorte des Restaurants existiert ein Eintrag mit **Name, Zone, Fahrer-Hinweis** und **optional Adresse**; **oder** eine Bestellung wurde einem bekannten Lieferort zugeordnet (ohne dass die KI einen Ort geraten hat). Ein bekannter Lieferort ist **nur** beim eigenen Restaurant sichtbar ([FEST 4]). |

## Ist-Ablauf heute (aus der Mitschrift, Runde 51)

Anrufer nennen beim Piloten oft **keinen Straßennamen**, sondern einen Ort, den das Restaurant kennt („Firma Soundso", „am See wie immer", „Baustelle Hauptstraße"). Heute weiß der Kollege am Telefon aus Erfahrung, wo das ist, und schreibt es auf den Zettel. fluvo bildet dieses Erfahrungswissen als **Liste bekannter Lieferorte** ab, damit auch die KI den Ort auflösen kann ([ENTSCHIEDEN Sirat 2026-09-23], Mitschrift Runde 51).

## Normalablauf (bekannten Lieferort anlegen)

1. Der **Inhaber** oder die **Annahme** öffnet die Liste bekannter Lieferorte des Restaurants.
2. Der Bearbeiter legt einen Eintrag an mit **Name** (der genannte Ort), **Zone** (aus dem Liefergebiet, FA-17), **Fahrer-Hinweis** (z. B. „Tor 2, beim Pförtner") und **optional einer Adresse** ([ENTSCHIEDEN Sirat 2026-09-23], Mitschrift Runde 51).
3. Das System speichert den Eintrag beim Restaurant. Ab jetzt kann die KI (FA-01) und die Annahme (FA-05) diesen Ort **wiedererkennen**.

## Ausnahmeabläufe

- **N. Nutzung durch die KI** (aus FA-01 Schritt 6/7): Ein Anrufer nennt einen Ort statt einer Adresse. Die KI **gleicht** den genannten Ort mit der Liste ab — **Treffer aus der Liste, kein Raten** (B18). Bei einem Treffer bestätigt die KI den Ort, übernimmt dessen **Zone** und braucht **keine Adresse**. Endet in: Lieferung mit aufgelöstem Ort (zurück in FA-01).
- **S. Stammkunde hat einen Ort statt einer Adresse** (FA-02): Ein Stammkunde (Erkennung nur per Rufnummer, [FEST 15]) kann im Kundeneintrag statt einer Adresse einen **Ort** hinterlegt haben. Die KI nutzt ihn wie einen bekannten Lieferort. Endet in: Lieferung mit aufgelöstem Ort.
- **U. Unbekannter Ort** (aus FA-01 Ausnahme 7b): Nennt der Anrufer einen Ort, der **weder in der Liste** noch **im Kundeneintrag** noch **beim Geocoder** auflösbar ist, fragt die KI **einmal** nach (Straße in der Nähe / Ortsteil). Bleibt der Ort unbekannt, **übergibt die KI an die Annahme** → **FA-03** (Grund „Adresse nicht auflösbar"). Die Annahme legt die Bestellung von Hand an (FA-05 4a) und kann den Ort dabei **sofort als bekannten Lieferort speichern**, damit die KI ihn künftig kennt ([ENTSCHIEDEN Sirat 2026-09-23], Mitschrift Runde 51). Endet in: Übergabe an die Annahme; Ort ggf. neu in der Liste.

## Darf nicht

- Die KI **rät** einen Ort **nie** — sie nimmt nur **Treffer aus der Liste** (oder aus dem Kundeneintrag / vom Geocoder) ([ENTSCHIEDEN Sirat 2026-09-23], Mitschrift Runde 51; B18, [FEST 8]).
- Die KI legt **nie** eine Liefer-Bestellung mit einem Ort an, der **weder in der Liste noch im Kundeneintrag noch beim Geocoder auflösbar** ist — sie übergibt an die Annahme (FA-01 7b) ([ENTSCHIEDEN Sirat 2026-09-23], Mitschrift Runde 51).
- Ein bekannter Lieferort eines Restaurants ist bei einem **anderen** Restaurant **nicht** sichtbar ([FEST 4], Briefing §6).

## Regeln und Zahlen

| Regel / Anforderung | Stufe | Quelle |
|---|---|---|
| **Liste bekannter Lieferorte je Restaurant** mit **Name, Zone, Fahrer-Hinweis**, **optional Adresse** | [ENTSCHIEDEN Sirat 2026-09-23] | Mitschrift Runde 51 |
| **Anlegen** dürfen **Inhaber und Annahme** | [ENTSCHIEDEN Sirat 2026-09-23] | Mitschrift Runde 51 |
| KI **gleicht ab** — **Treffer aus der Liste, kein Raten**; bei Treffer keine Adresse nötig, Zone aus dem Eintrag | [ENTSCHIEDEN Sirat 2026-09-23] | Mitschrift Runde 51 |
| Stammkunde (FA-02) kann statt einer Adresse einen **Ort** hinterlegt haben | [ENTSCHIEDEN Sirat 2026-09-23] | Mitschrift Runde 51 |
| **Unbekannter Ort:** einmal nachfragen, sonst Übergabe an die Annahme (FA-01 7b); die Annahme kann beim Anlegen **sofort** als bekannten Lieferort speichern | [ENTSCHIEDEN Sirat 2026-09-23] | Mitschrift Runde 51 |
| KI legt **nie** eine Liefer-Bestellung mit unauflösbarem Ort an | [ENTSCHIEDEN Sirat 2026-09-23] | Mitschrift Runde 51 |
| **Fahrer-Hinweis** des bekannten Lieferorts steht auf dem **Bon** (FA-06) | [ENTSCHIEDEN Sirat 2026-09-23] | Mitschrift Runde 51 |
| Bekannte Lieferorte optional im **Onboarding** anlegbar | [ENTSCHIEDEN Sirat 2026-09-23] | Mitschrift Runde 51 (→ FA-20) |
| Mandantentrennung: bekannter Lieferort nur beim eigenen Restaurant sichtbar | [FEST] | Briefing §2.4, §6 |

## Testszenarien

| Szenario | Eingabe / Setup | Erwartetes Ergebnis | Darf nicht | Prüfung |
|---|---|---|---|---|
| FA-24-T1 · Bekannten Lieferort anlegen (Inhaber) | Inhaber legt „Testfirma Nord" an: Zone „Ortsteil A", Fahrer-Hinweis „Tor 2, beim Pförtner", ohne Adresse | Eintrag gespeichert; ab jetzt für KI/Annahme auffindbar | Eintrag ohne Zone; Eintrag bei fremdem Restaurant sichtbar | manuell + automatisch |
| FA-24-T2 · Bekannten Lieferort anlegen (Annahme) | Annahme (Betriebsrecht) legt „Baustelle Teststraße" an | Eintrag gespeichert; die Annahme darf anlegen | Annahme darf nicht anlegen | manuell + automatisch |
| FA-24-T3 · KI nutzt Treffer (kein Raten) | Anrufer nennt „Testfirma Nord"; Eintrag existiert | KI findet den Treffer, bestätigt den Ort, übernimmt dessen Zone, fragt keine Adresse ab | Ort raten; falscher/erfundener Ort; Adresse trotz Treffer verlangen | Testanruf + automatisch |
| FA-24-T4 · Stammkunde mit Ort statt Adresse (FA-02) | Stammkunde `+49 30 23125 241` mit hinterlegtem Ort ruft an | KI erkennt den Kunden per Rufnummer, nutzt den hinterlegten Ort wie einen bekannten Lieferort | Adresse neu erfragen, obwohl ein Ort hinterlegt ist | Testanruf + automatisch |
| FA-24-T5 · Unbekannter Ort → Übergabe (FA-01 7b) | Anrufer nennt „am alten Turm"; nicht in Liste, Kundeneintrag oder Geocoder auflösbar | KI fragt einmal nach; ohne Auflösung Übergabe an die Annahme (FA-03 „Adresse nicht auflösbar") | Liefer-Bestellung mit unauflösbarem Ort anlegen; Ort raten | Testanruf + automatisch |
| FA-24-T6 · Annahme speichert Ort sofort beim Anlegen | Nach Übergabe (T5) legt die Annahme von Hand an und speichert „am alten Turm" als bekannten Lieferort | Bestellung angelegt (FA-05); neuer Eintrag in der Liste; künftig für die KI auffindbar | Ort geht ohne Speichermöglichkeit verloren | manuell + automatisch |
| FA-24-T7 · Fahrer-Hinweis auf dem Bon | Liefer-Bestellung an „Testfirma Nord" mit Fahrer-Hinweis | Der Fahrer-Hinweis erscheint auf dem Bon (FA-06) | Fahrer-Hinweis fehlt auf dem Bon | manuell am Gerät + automatisch |
| FA-24-T8 · Zwei-Restaurant-Fall | Restaurant A „Musterpizza" hat „Testfirma Nord"; Restaurant B „Testdöner" ruft dieselbe Bezeichnung nicht ab; Testrufnummer `+49 30 23125 242` | Der bekannte Lieferort von A ist nur bei A sichtbar; B findet ihn nicht | Übergriff auf fremden Tenant | automatisch |

## Rückverfolgung

- **Prozessschritt:** P? „Stammdatenpflege → bekannte Lieferorte" und „KI-Gespräch → Ort auflösen" (K2 noch offen)
- **Zustandsübergänge:** keiner an einer Bestellung — Stammdatenpflege; die Nutzung wirkt auf `createOrder` (Adresse/Ort → Zone)
- **Technische Anwendungsfälle:** TU-? (bekannten Lieferort anlegen/ändern; Function Call `resolve_delivery_place` der KI — Abgleich mit der Liste, kein Raten; Zuordnung in K7)
- **Verträge / Events:** vorläufig `delivery_place.upserted`; die Nutzung fließt in `order.created` (aufgelöste Zone). Datenklasse des Eintrags (kann Personenbezug tragen) → K5. (K6 noch offen)
- **Testszenarien:** FA-24-T1 … FA-24-T8 (Tabelle oben)
- **Nachbar-Fälle:** FA-01 (KI nutzt den Ort, Schritt 6/7, Ausnahme 7b), FA-02 (Stammkunde mit Ort statt Adresse), FA-03 (Übergabe „Adresse nicht auflösbar"), FA-05 (Annahme legt von Hand an und speichert den Ort), FA-06 (Fahrer-Hinweis auf dem Bon), FA-17 (Zone), FA-20 (Onboarding, optional bekannte Lieferorte)

## Offene Fragen

> **Frage an Sirat:** Wer darf einen bekannten Lieferort **ändern und entfernen** — Inhaber und Annahme (wie beim Anlegen) oder nur der Inhaber? In Runde 51 ist nur das **Anlegen** (Inhaber und Annahme) entschieden; Ändern/Entfernen wurde nicht genannt. (Wirkung: Betriebs-/Geldrecht-Zuordnung, K9.)

> **Frage an Sirat / Anwalt (Q10):** Ein bekannter Lieferort kann **Personenbezug** tragen (Firmenname, Kundenbezeichnung, Fahrer-Hinweis mit Namen). Welche **Datenklasse** und welche **Löschfrist** gelten für die Liste? (Datensparsamkeit, Löschkonzept — nicht in Runde 51 entschieden.)

> **Frage an Sirat:** Soll der **Fahrer-Hinweis** dem Anrufer am Telefon **vorgelesen** werden, oder erscheint er **nur auf dem Bon** für den Fahrer? In Runde 51 ist nur „auf dem Bon" genannt. (Wirkung: Gesprächsdesign K4.)

## Nicht Teil dieses Anwendungsfalls

- **Nutzung** des Ortes im laufenden KI-Gespräch im Detail (Wortlaut, Rückfragen) → FA-01 / K4.
- Zuordnung Adresse → Ortsteil per Geocoder → FA-01 (7), FA-17, Q6.
- Stammkunden-Erkennung und -Ablauf → FA-02.
- Bon-Layout (wo der Fahrer-Hinweis steht) → FA-06 / K10.

<script type="text/markdown" id="md6" data-title="ADR 0014 · Vorgehen" data-path="docs/decisions/0014-vorgehen-durchstich-spur.md">
# 0014 · Vorgehen — Durchstich-Spur statt K1…K11 in fester Reihenfolge

- **Status:** entschieden (Sirat, im Gespräch) — Änderung der Arbeitsweise, ergänzt ADR [0004](0004-arbeitszyklus.md) (Arbeitszyklus) und ADR [0006](0006-piloten-schnitt-k1.md) (Piloten-Schnitt); hebt keinen [FEST]-Punkt auf
- **Datum:** 2026-09-23
- **Stufe:** [ENTSCHIEDEN Sirat] (Arbeitsweise / Konzeptphase) — nicht [FEST], das bleibt dem Briefing vorbehalten
- **Entschieden von:** Sirat

## Anlass

Die Konzeptphase (K1–K11, ADR [0005](0005-konzeptphase.md)) war als **feste Reihenfolge** angelegt: erst alle elf Artefakte abnehmen, dann bauen. K1 (fachliche Anwendungsfälle) hat sich über **51 Gesprächsrunden** gezogen (Mitschrift `docs/konzept/anwendungsfaelle/_gespraechsnotizen-K1.md`). In Runde 52 hat Sirat entschieden, **agiler** vorzugehen und **früher Code** zu schreiben — aber **nicht blind**: Zuerst will er ein **Architekturbild mit Skalierungsaussage** und das **Datenmodell** sehen, „damit man weiß, welche Technologien man verwendet, wie es aussieht und wie es skaliert". Danach soll am **echten Anruf** gelernt werden, statt das Konzept vollständig vorab zu Ende zu schreiben.

## Entscheidung

fluvo baut den Piloten-Durchstich als **eine Spur** aus Konzept und Code, statt K2…K11 vollständig vor dem ersten Code abzunehmen. Die Reihenfolge:

- **Stufe 0 — Fundament (Konzept, kein Code):**
  - **Architekturbild** mit Technologie- und Skalierungsaussage → [`docs/konzept/modelle/architektur.md`](../konzept/modelle/architektur.md) (aus Briefing §4/§5, aktualisiert um ADR 0008–0013).
  - **K5-Ausschnitt Datenmodell** für den Durchstich (ER-Diagramm + Datenwörterbuch mit DSGVO/GoBD-Klasse).
  - **K3 Zustandsmodell** der Bestellung als **eine Seite** (Übergangstabelle).
- **Stufe 1 — Kern als Code** mit Tests aus den K1-Durchstich-Fällen (Zustandsmaschine, Preise, `createOrder`, Mandantentrennung, Event-Log).
- **Stufe 2 — Voice-Adapter** gegen die **Sandbox** (Testumgebung des Anbieters); **K4** (Gesprächsdesign) entsteht **im Bau**, nicht vorab fertig.
- **Stufe 3 — Annahme minimal + Bon-Druck.**
- **Stufe 4 — zehn Testanrufe**, danach das Konzept an der Realität **nachziehen**.

**K2, K8, K9, K10, K11 bleiben „dünn"** und **wachsen mit dem Code** — sie werden nicht vorab ausgearbeitet, sondern gefüllt, sobald der Durchstich sie berührt. **Konzept-Abnahmen** (Status `abgenommen` nach Kreuzverhör und Sirats Ja) gibt es in dieser Stufe **nur** für die **K1-Durchstich-Fälle**, **K3** und den **K5-Ausschnitt** — nicht für die dünnen Artefakte.

**Nicht in der Spur** (bewusst zurückgestellt): FA-24 (bekannte Lieferorte), Großbestellung, Sprachen über Deutsch/Englisch hinaus, Onboarding, Betreiber-Monitoring, Kassen-/Tresen-Abschluss. Sie bleiben im Konzept dokumentiert und kommen nach dem Durchstich.

## Betrachtete Alternativen

| Alternative | Dafür | Dagegen |
|---|---|---|
| **Konzept vollständig zu Ende** (K1…K11 in fester Reihenfolge abnehmen, dann bauen) | maximale Klarheit vor dem Code; ADR 0005 wörtlich | 51 Runden allein für K1 zeigen: zu langsam; viele Fragen (Telefonie Q1, Druck Q8, Voice-Latenz/Karte Q5) lassen sich **nur am echten Anruf** beantworten, nicht am Schreibtisch |
| **Reiner Wegwerf-Prototyp ohne Kern** (schnell etwas Anrufbares zusammenstecken) | am schnellsten ein „es klingelt und druckt" | verletzt die zehn Regeln (kein Event-Log, keine RLS, keine Zustandsmaschine); das Ergebnis wäre nicht tragfähig und müsste komplett neu gebaut werden |
| **Durchstich-Spur** (gewählt) | früh am echten Anruf lernen, **ohne** die Kern-Qualität aufzugeben; Architektur und Datenmodell zuerst | Ränder bleiben zunächst dünn; Disziplin nötig, damit der Durchstich kein Wegwerf-Prototyp wird (siehe Folgen) |

## Folgen

- **Der Arbeitszyklus bleibt verbindlich (ADR [0004](0004-arbeitszyklus.md)).** Sobald Code entsteht, gelten die sechs Phasen (Planen → Testen zuerst → Bauen → Prüfen → Verifizieren → Sichern) unverändert. „Agiler" heißt **früher** Code, **nicht** weniger Sorgfalt.
- **Code je Arbeitspaket nur auf Sirats ausdrückliche Ansage** (Discovery-Phase, CLAUDE.md). Diese Spur ist ein Plan, keine Blanko-Freigabe zum Losbauen.
- **Kern-Qualität ist nicht verhandelbar.** Zustandsmaschine, Row-Level-Security (`tenant_id` + RLS) und das unveränderliche Event-Log sind **von Anfang an** vollständig — genau hier wird nicht „dünn" gebaut. Die zehn Regeln gelten ohne Ausnahme.
- **Die Ränder dürfen dünn sein.** Betreiber-Monitoring, Onboarding, Oberflächen jenseits der Annahme, NFA-Zahlen und Pilot-Kriterien wachsen mit dem Code statt vorab.
- **Das Datenmodell wird vollständig angelegt, auch wo der Pilot Felder leer lässt** (K5): `fiscal_transactions`, Teilzahlungen je Zahlart, Fahrer-Zuordnung — damit die Rückfälle aus ADR 0008 (Variante C) und die spätere Fahrer-App ohne Umbau möglich bleiben.
- **Risiko „der Prototyp wird nie weggeworfen".** Weil der Durchstich echten Kern-Code enthält, besteht die Gefahr, dünn gebaute Ränder später als „fertig" zu behandeln. **Begrenzt wird das so:** (1) Der **Kern** ist von Beginn an voll und getestet — er *ist* das Produkt, kein Wegwerfteil. (2) Nur die **Ränder** sind dünn und tragen im Konzept sichtbar den Status „dünn/wächst mit dem Code", nicht `abgenommen`. (3) Jede dünne Stelle bleibt eine offene Aufgabe in Roadmap/Konzept, bis sie den vollen Arbeitszyklus durchlaufen hat. (4) Nach den zehn Testanrufen (Stufe 4) wird das Konzept nachgezogen — die Lernpunkte gehen in K2/K4/K8–K11 zurück, nichts bleibt stillschweigend „so wie hingehackt".
- **Externe Konten und Unterauftragsverarbeiter brauchen Sirats Entscheidung.** Retell-Sandbox, Geocoder (Q6), Hosting-/DB-Konten, Sentry: jeder neue externe Dienst ist ein Unterauftragsverarbeiter → Rückfrage an Sirat und Eintrag in `open-questions.md` (security.md). Die Spur legt das nicht selbst an.
- **Nachzuziehen (durch `doc-updater`):** `docs/roadmap.md` (Bauschritte in die Durchstich-Stufen fassen), `docs/konzept/README.md` (K2/K8/K9/K10/K11 als „dünn, wächst mit dem Code" kennzeichnen; Abnahme-Umfang benennen).

## Wann neu bewerten

- Wenn die zehn Testanrufe (Stufe 4) zeigen, dass die dünnen Ränder den Durchstich blockieren (dann das betroffene Artefakt vorziehen und voll ausarbeiten).
- Wenn sich herausstellt, dass ein „dünn" gebauter Rand doch Kern-Qualität braucht (dann in den vollen Arbeitszyklus heben, nicht nachbessern).
- Nach dem ersten Piloten: ob die Spur für den nächsten Ausbau (Fahrer-App, Website, Abrechnung) weiter taugt oder wieder ein festeres Konzept vorausgehen soll.

**Nachtrag 2026-09-23:** siehe ADR 0015 (Zustandskette der Bestellung im Piloten). Der in Stufe 0 verlangte K3-Entwurf ist gegengelesen und für den Bestell-Durchstich entschieden (reduzierte Kette, Merkmale statt Zustände, Storno am Merkmal „bezahlt").

**Nachtrag 2026-09-23:** siehe ADR 0016 (Drei Datenklassen a/b/c). Der in Stufe 0 verlangte K5-Ausschnitt (Datenwörterbuch mit DSGVO/GoBD-Klasse) stützt sich auf drei Datenklassen; deren Struktur ist damit entschieden (schließt Compliance-Befund B1).

</script>
<script type="text/markdown" id="md7" data-title="Gegenlesen K3" data-path="docs/konzept/modelle/_gegenlesen-K3.md">
# Gegenlesen K3 · Zustandsmodell der Bestellung (Piloten-Durchstich)

**Prüfer:** architect · **Datum:** 2026-09-23 · **Vorlage:** `docs/konzept/modelle/zustand-bestellung.md` (requirements-engineer, 2026-09-23)
**Gelesen:** Briefing §2/§5.3/§5.4, CLAUDE-Regel 4 und 7, ADR 0006/0008/0010/0011/0013/0014, Skill `fluvo-core-domain`, FA-01 (9b), FA-06, FA-11, FA-15, FA-16, open-questions Q3/Q13.
**Rolle dieses Berichts:** Vorbereitung zur Entscheidung. **Entscheidungen trifft Sirat.** Nichts hierin ändert einen [FEST]-Punkt.

**Gesamturteil:** Der Entwurf ist tragfähig und geht sauber mit [FEST 2] um (Vorschlag zu Q13, nicht still überschrieben). Er ist **abnahmefähig, sobald zwei Korrekturen eingearbeitet sind** (Punkt 6: bezahltes „Mitnehmen"; Storno-Recht an „bezahlt" statt an den Zustand koppeln) und vier Rest-Unterpunkte von Q13 **nicht** mitgeschlossen, sondern weitergeführt werden.

---

## 1. Verletzt die Reduktion [FEST 2]?

**Zustimmung — ja, deine Lesart ist richtig, mit einer Präzisierung.**

[FEST 2] hat zwei Ebenen. Das **Prinzip** (ein zentrales Bestellobjekt als Zustandsmaschine, **der Server entscheidet jeden Übergang, nur vorwärts, Storno als eigener protokollierter Pfad** — Briefing §2.2/§5.3, CLAUDE-Regel 4) bleibt **unangetastet**. Die konkrete **Sechser-Kette** (`Eingegangen → In Küche → Fertig → Unterwegs → Geliefert → Abgerechnet`) ist zwar in §2.2 namentlich als [FEST] notiert — aber ADR 0006 hat genau diese Kette bereits ausdrücklich als „berührt [FEST], **nicht** entschieden → K3/architect/Sirat" (Q13) markiert. Das Reduzieren **in einem gekennzeichneten Vorschlag** ist damit der **vorgesehene Weg**, kein Bruch. ADR 0006 strich die Küche (kein `in_kitchen`/`ready` von Hand), ADR 0008 den Fahrer (kein `out_for_delivery`).

| Befund | Schwere | Empfehlung |
|---|---|---|
| Prinzip von [FEST 2] (Server, nur vorwärts, Storno-Pfad) vollständig gewahrt | Kein Befund | So lassen. |
| `handed_over` und `ended_unpaid` sind **Ergänzungen** über die Kette hinaus, nicht bloß eine Teilmenge | Niedrig | Der Entwurf nennt sie korrekt „ergänzt zwei Enden". Weil es echte **Erweiterungen** der namentlich festen Kette sind, brauchen genau sie Sirats **ausdrückliches Ja** — das ist der Kern von Q13. So kennzeichnen, nicht als „nur Teilmenge" verharmlosen. |

---

## 2. Zukunftssicher, die späteren Zustände später einzuschieben?

**Ja — mit Vorkehrungen, die jetzt getroffen werden, aber leichtgewichtig sind.** Das spätere Einschieben von `in_kitchen`/`ready`/`out_for_delivery`/`settled` **zwischen** `received` und `delivered` ist unkritisch, **weil das Event-Log Tatsachen protokolliert, nicht den Graphen.** Die Übergangstabelle ist Code; historische `order_events` bleiben gültig, egal wie die Tabelle später aussieht. Kein Daten-Rückbau nötig.

| Befund | Schwere | Empfehlung |
|---|---|---|
| Statuswert-Menge muss erweiterbar sein | Niedrig | `OrderStatus` als **String-Literal-Union aus dem Zod-Schema** + Textspalte (ggf. CHECK-Constraint, per neuer Migration ersetzbar) — **kein Postgres-`ENUM`-Typ** (schwer erweiter-/umsortierbar; deckt sich mit typescript.md „keine enums"). Formulierung im Entwurf „bleibt im Enum vorgesehen" entsprechend als Union/Textspalte präzisieren, nicht als DB-Enum. |
| Ereignisnamen müssen **stabil und bedeutungsdauerhaft** sein | Niedrig | Genau so wie im Entwurf (`order.delivered` heißt „Lieferung abgeschlossen" — bleibt gültig, auch wenn später `out_for_delivery → delivered` davorsteht). Beibehalten. |
| „offen vs. terminal" darf nicht an einzelne Statuswerte gebunden werden | Mittel | Nicht `status = 'received'` als „offen" verdrahten (sonst brechen Monitoring/Listen beim Einschieben neuer Zustände). Zentrale abgeleitete Mengen `OPEN_STATES` / `TERMINAL_STATES` an **einer** Stelle im Kern definieren. |
| Event-Nutzlast selbstbeschreibend | Niedrig | Jedes Übergangs-Event trägt `from`/`to` im Payload (Skill-Feld `payload`), damit der Trail auch bei wachsender Tabelle lesbar bleibt. |

---

## 3. `ended_unpaid` als eigenes Ende vs. Storno-Pfad „nicht abgeholt"

**Empfehlung: eigenes Ende mit eigenem Ereignis `order.ended_unpaid` — nicht in `order.cancelled` einfalten.** Begründung aus Event-Log/GoBD/Auswertung:

- **Wirtschaftlich verschieden:** Storno = annulliert (oft **vor** Produktion, keine Ware). „Nie abgeholt" = **Ware wurde produziert** (Bon gedruckt, Küche hat gekocht), aber nie kassiert → **Schwund/Verlust**. Das ist ein anderer Sachverhalt.
- **GoBD-Audit-Trail** (Regel 7, append-only): Der unveränderliche Trail soll diese Unterscheidung **tragen**, nicht in einem Grund-Freitext von `cancelled` verstecken. Sonst geht die Trennung Storno-Quote ↔ Schwund-Quote in der Auswertung verloren.
- **Rechte stimmen mit dem Muster „vor Zahlung" überein:** `ended_unpaid` ist per Definition **ohne** Zahlung; sowohl Annahme (mit Pflichtgrund) als auch Inhaber dürfen bestätigen (ADR 0010) — gleiches Rechteprofil wie Storno vor Zahlung, nicht wie Storno nach Zahlung.

| Befund | Schwere | Empfehlung |
|---|---|---|
| Gleiche Mechanik (Pflichtgrund, Protokoll, Log) verleitet zum Zusammenlegen | Mittel | **Trennen.** Eigenes, append-only `order.ended_unpaid` ist nicht verhandelbar (Trail muss unterscheiden); eigener terminaler Statuslabel ist zusätzlich sinnvoll für die Liste „nicht abgeschlossen" (FA-16). Fiskalische Behandlung bleibt **Q3** (Steuerberaterin) — der **Name/das Modell** kann Sirat jetzt entscheiden, die **Fiskal-Frage** nicht. |

---

## 4. „Rückruf nötig" (FA-01 9b): Vor-Anlage außerhalb der FSM vs. `pending_callback` vor `received`

**Empfehlung: Vor-Anlage-Zustand außerhalb der Bestell-Zustandsmaschine (Variante A des Entwurfs).**

- **[FEST] Briefing §5.4: „kein Datensatz in den Bestellungen vor Bestätigung."** In 9b hat zwar der **Anrufer** bestätigt, aber FA-01 9b sagt ausdrücklich: die KI „**legt sie nicht selbst an**, sondern übergibt". Die **maßgebliche** Bestätigung, die aus der Aufnahme eine Bestellung macht, ist hier die des **Menschen** ([FEST 11]: die KI sagt nichts zu, was Geld kostet). Also entsteht korrekterweise **kein `orders`-Datensatz**, bis ein Mensch `createOrder` auslöst.
- `pending_callback` **vor** `received` würde einen Nicht-Auftrag in `orders` und in die FSM legen → widerspricht §5.4, verunreinigt den Start-Invarianten (`received` = echte, bestätigte Bestellung) und den Trail (ein `order.created` für etwas, das noch keine Bestellung ist).
- **Konsistent** mit dem Eskalationsmodell: `escalate_to_human` (FA-03) ist ein Function Call, kein `createOrder`. „Rückruf nötig" gehört fachlich zur **Aufnahme-/Eskalationswelt**, nicht zum Bestell-Lebenszyklus.

| Befund | Schwere | Empfehlung |
|---|---|---|
| Vormerkung muss trotzdem dauerhaft, mandantengebunden und an der Annahme sichtbar sein | Niedrig | Variante A empfehlen. Die Vormerkung braucht eine **eigene kleine Tabelle** (z. B. `intake_drafts`/`call_handoffs`) mit `tenant_id` + RLS (Regel 6) — **nicht** `orders`. Erst die menschliche Bestätigung ruft `createOrder` → `received`. |
| Zeitpunkt | Niedrig | ADR 0014 stellt „Großbestellung" **außerhalb der Durchstich-Spur**. Nicht jetzt bauen — aber die **Modellhaltung** (außerhalb der FSM) jetzt festhalten, damit das Schema später nicht kontaminiert wird. Entscheidung Sirat. |

---

## 5. „quittiert" als Merkmal (ADR 0010): richtig oder Zustand?

**Merkmal — bestätigt, der Entwurf liegt richtig.**

Die Quittierung ist **orthogonal** zum Erfüllungs-Lebenszyklus: Sie bewegt die Bestellung nicht vorwärts (quittiert/unquittiert sind beide `received`), sondern löst den **Bon-Druck** aus (FA-06). Als Zustand modelliert würde sie den Zustandsraum aufblähen (Quittier-Varianten × alles Übrige; Asymmetrie, weil Handannahme sie überspringt). Als Merkmal passt sie zu Gehirn-vs-Hände (deterministischer Server-Fakt, Uhr hereingereicht) und zum append-only-Trail.

| Befund | Schwere | Empfehlung |
|---|---|---|
| Quittierung ändert keinen Bestellstatus, ist aber protokollpflichtig | Kein Befund | Als Merkmal führen (`acknowledged_at`, `acknowledged_by`, `acknowledged_via: user \| timeout`) **plus** append-only `order.acknowledged` — der 2-Minuten-Notdruck ist beweispflichtig („unquittiert gedruckt"). **Nicht** in `OrderStatus` aufnehmen. Das kleine 3-Wert-Merkmal (unquittiert → quittiert \| unquittiert-gedruckt) ist ein Sub-Attribut, kein FSM-Zustand. |

---

## 6. Übergangstabelle vollständig gegen FA-06/11/15/16?

**Weitgehend vollständig — aber ein echter Fehler bei bezahltem „Mitnehmen" und eine unscharfe Storno-Bedingung.**

| Befund | Schwere | Empfehlung |
|---|---|---|
| **Mitnehmen ist bereits bei Anlage bezahlt** (FA-15 1a: „sofort beim Bestellen bar"), also `paid` **im Zustand `received`** — nicht erst auf der Kante `received → handed_over`. Ein Storno einer solchen Bestellung ist ein Storno **nach erfasster Zahlung** → **nur Inhaber** (FA-15 4c, FA-11 4a). Die Tabelle bietet dafür aber nur „`received → cancelled` (Annahme, **vor** Zahlung, frei)" — **falsch** für ein bezahltes Mitnehmen. | **Hoch** | Storno-**Recht** an das Merkmal **„Zahlung erfasst"** koppeln, **nicht** an den Zustand. Regel: Annahme storniert frei, solange **keine Zahlung erfasst und kein Endzustand**; sonst **nur Inhaber**. `order.paid` muss auch in `received` auftreten können (Mitnehmen). |
| `delivered` (Lieferung) hat **keine erfasste Zahlung** (ADR 0008). Die Kante `delivered/handed_over → cancelled` trägt aber die Bedingung „**nach erfasster Zahlung**" — für Lieferung gegenstandslos. | Mittel | Bedingung entkoppeln: Storno **aus einem Endzustand → nur Inhaber**, unabhängig von der Zahlung. Zusammen mit Befund 1 ergibt das **eine** saubere Regel statt zweier verwaschener. |
| `received` ist stark **überladen**: neu/unquittiert, Vorbestellung wartend, quittiert/Küche kocht, wartet auf Abholung — alles derselbe Status. | Niedrig | Keine fehlende Kante, aber Annahme-/Monitoring-Sichten müssen die Unterlage aus **Merkmalen** ableiten (quittiert? Vorbestellung fällig? Bon gedruckt?). Für den Piloten akzeptabel (ADR 0006: keine Küchen-Status), aber im Datenmodell (K5) die Merkmale sauber vorsehen. |
| **Liefer-Bestellung, bei der niemand „geliefert" drückt** → bliebe für immer in `received` (FA-06/ADR 0008/Q13). | Niedrig | Der Entwurf führt das korrekt als offene Frage. Für den Piloten braucht es einen sichtbaren Abschlussweg am Tagesende (sonst Halden in `received`) — als Rest-Unterpunkt von Q13 weiterführen, nicht stillschweigend schließen. |
| Abgedeckt und korrekt: `order.amended` ohne Statuswechsel (FA-11: Teilstorno/Position streichen/Adress- & Bestellart-Wechsel), Storno vor/nach, `ended_unpaid` (FA-15/16), Abschluss ändert **keinen** Bestellstatus (FA-16), Doppelquittierung idempotent (FA-06 4c), Storno+Neuanlage statt Rücksprung (FA-11 3f). | Kein Befund | So lassen. |

---

## 7. Ereignisnamen (englisch) konsistent und K6-/code-tauglich?

**Ja — konsistente Konvention (`order.<partizip>`, punkt-namensräumig, Vergangenheit), passt zum Skill-Feld `type` und zur String-Literal-Union in `schemas`.** Drei Präzisierungen:

| Befund | Schwere | Empfehlung |
|---|---|---|
| `order.paid` wird im Entwurf an die Kante `received → handed_over` gebunden („+ `order.paid`"). Zahlung fällt aber zeitlich auseinander (Mitnehmen: bei Anlage; Abholung: bei Übergabe; Lieferung: nie im Piloten). | Mittel | `order.paid` als **eigenständiges**, an einen Zahlungssatz gebundenes Ereignis führen, **entkoppelt** von der Erfüllungskante — stützt zugleich Teilzahlungen je Zahlart (Briefing §5.2, Gutschein+bar FA-15). Erwägen: `payment.captured` statt `order.paid`. Löst zusammen mit Punkt 6 das Recht-an-Zahlung-Problem. |
| `order.acknowledged` bezeichnet **beides**: menschliche Quittierung **und** 2-Minuten-Notdruck („unquittiert gedruckt") — semantisch gegensätzlich. | Niedrig | Über `actor` (`user`/`system`) **plus** Payload-Flag (`printed_unacknowledged: true`) unterscheiden, oder eigenes `order.print_forced_unacknowledged`. Nicht denselben Namen „acknowledged" für „gerade **nicht** acknowledged" tragen lassen. |
| `order.ended_unpaid` eigener Name | Kein Befund | Beibehalten (siehe Punkt 3). Namensräume `print.*` (FA-06) und `counter.*` (FA-16) korrekt getrennt vom `order.*`-Lebenszyklus — gut. Alle Namen bleiben **vorläufig bis K6** (Entwurf kennzeichnet das bereits). |

---

## Abschluss

**Kann Q13 mit dieser Reduktion geschlossen werden? — Bedingt ja, Entscheidung Sirat.** Für die im Durchstich enthaltenen Bestellarten (Lieferung, Abholung nach Anruf, Mitnehmen ohne Anruf) klärt der Entwurf die Unterpunkte:
- (a) Weg ohne „Unterwegs" → gelöst (`handed_over`); (b) „In Küche"/„Fertig" nicht von Hand → gelöst (bleibt `received`); (g) „quittiert" Merkmal → gelöst; (e) Storno-Pfad → gelöst **nach** Einarbeitung der Punkt-6-Korrektur; (d) „nie abgeholt" → gelöst (`ended_unpaid`).

**Nicht mitschließen, sondern weiterführen** (sonst wird Q13 fälschlich als erledigt verbucht):
- Verhältnis `delivered` ↔ „Abgerechnet" für Lieferungen ohne erfasste Zahlung **und** „niemand drückt geliefert" (der Entwurf führt beides selbst als offen);
- (c) Fahrer-Scan lösen und (d) „nicht zustellbar" → mit dem Fahrer-Teil **zurückgestellt** (ADR 0008);
- (f) **Lebenszyklus des Restaurants** (in Einrichtung → startklar ↔ gesperrt) → **nicht** dieses Artefakt, gehört zu K9/FA-20/21;
- **Fiskalische** Seite von Storno und `ended_unpaid` → bleibt **Q3** (Steuerberaterin), unabhängig von Q13.

Empfehlung: Sirat schließt Q13 **für den Bestell-Durchstich** ab, sobald die zwei Punkt-6-Korrekturen eingearbeitet sind, und die obigen Rest-Unterpunkte werden als **eigene** offene Punkte weitergeführt (durch `doc-updater` in `open-questions.md` nachziehen).

**Muss der Skill `fluvo-core-domain` nachgezogen werden? — Ja (nur benennen, nicht hier ändern).** Der Skill kodiert derzeit die **volle Sechser-Kette** als maßgebliche `transitions`-Konstante (`received → in_kitchen → ready → out_for_delivery → delivered → settled`) und kennt weder `handed_over` noch `ended_unpaid`. Da der Skill „bei jeder Arbeit in `packages/core`" geladen wird, würde er die Umsetzung in die Irre führen. Nach Sirats Entscheidung durch `doc-updater` an die Piloten-Übergangstabelle anpassen (volle Kette als Zielbild vermerkt). Ebenso: Briefing §2.2/§5.3 tragen die namentlich feste Kette — Briefing-Änderung nur auf Sirats Wort; bis dahin gelten K3 + ein neuer ADR (Status `vorgeschlagen`) als dokumentierte Abweichung, Muster wie ADR 0008/0013.

</script>
<script type="text/markdown" id="md8" data-title="Gegenlesen K5 · DB" data-path="docs/konzept/modelle/_gegenlesen-K5-db.md">
# K5 · Gegenlesen Datenmodell (DB-Sicht) — Piloten-Durchstich

- **Prüfer:** database-reviewer · **Datum:** 2026-09-23 · **Grundlage:** `er-durchstich.md`, `../vertraege/datenwoerterbuch.md` (beide Entwurf 2026-09-23)
- **Kontext:** Briefing §2/§5.2, CLAUDE.md 6/7, Skills `fluvo-multi-tenant`, `fluvo-core-domain`, `zustand-bestellung.md` (K3), FA-17/Q6/Q10, ADR 0008/0010/0012/0013
- **Einordnung:** Konzept-Datenmodell, das direkt in Drizzle-Schema + Migrationen übersetzt wird. Kein Code geprüft (existiert noch nicht).
- **Gesamtbild:** Solide, sauber getrennte Datenklassen, Cent/UTC durchgehalten, `orders`/`order_customer_details`-Schnitt ist richtig gedacht. Die Befunde betreffen fast alle **Integritäts- und Schlüsselentscheidungen, die vor der ersten Migration fallen müssen**, sowie drei fehlende Felder, ohne die die beiden Enden des Durchstichs (Bon-Druck, Tresen-Abschluss) technisch nicht sauber laufen.

## 1 · Mandantentrennung

| # | Befund | Schwere | Empfehlung |
|---|---|---|---|
| 1.1 | Alle FKs im Modell sind **einspaltig** (`menu_id`, `category_id`, `item_id`, `order_id`, `customer_id`, `delivery_zone_id`, `shift_id`, `collected_by`, `known_place_id` …). Der Skill verlangt zusammengesetzte FKs `(tenant_id, id)`, damit eine Zeile nie über eine FK-Kette auf einen fremden Tenant zeigt und RLS nicht umgangen wird. | blocker | Systementscheidung: intra-Tenant-FKs als `(tenant_id, id)` mit zusammengesetztem Unique/PK auf der Elterntabelle. Betrifft jede Tabelle → vor der ersten Migration festlegen (siehe „Drei Dinge" #1). |
| 1.2 | `orders.order_number` hat **keine** Eindeutigkeit und keine Vergabestrategie. Global oder je Tenant? Doppelte Bestellnummern sind möglich. | blocker | `unique (tenant_id, order_number)` + je-Tenant-Sequenz/Zähler festlegen (nie globaler Serial → verrät Fremdvolumen). |
| 1.3 | `menus` „genau eine je Tenant" ist nur als Prosa notiert, ohne Constraint. | wichtig | `unique (tenant_id)` auf `menus` erzwingen. |
| 1.4 | `devices.token_hash`, `voice_calls.provider_call_id` sind **Nachschlagschlüssel vor** gesetztem Tenant (CloudPRNT: Token→`devices`→Tenant; Voice-Webhook: Anbieter-ID→Tenant). Diese Lookups laufen ohne Session-Tenant und müssen global eindeutig sein — Ausnahme zur „Eindeutigkeit je Tenant"-Regel. | wichtig | `token_hash`/`provider_call_id` global-unique; diese Lese-Pfade als klar benannte, tenant-agnostische Funktion (kein `BYPASSRLS`), die den Tenant *ableitet* und dann `withTenant` betritt. |
| 1.5 | **Keine Mapping-Tabelle** für den eingehenden Voice-Webhook (Retell-Agent-/Nummern-ID → Tenant), bevor ein `voice_calls`-Satz existiert. Der Skill nennt „eigene Zuordnungstabelle". | wichtig | Tabelle `voice_agents`/`phone_numbers` (Anbieter-ID → tenant_id) ergänzen; sonst kann der Webhook den Tenant nicht auflösen. |
| 1.6 | `tenant_id` fehlt in den Feldlisten mehrerer Speisekarten-Tabellen (`menu_categories/items/options/variants`) — laut Konvention getragen, aber nirgends je Tabelle bestätigt. | hinweis | In der Übersetzung strikt: `tenant_id not null references tenants(id)` **und** RLS-Policy in *derselben* Migration je Tabelle (sonst Blocker beim Review). |

## 2 · `order_events` (append-only)

| # | Befund | Schwere | Empfehlung |
|---|---|---|---|
| 2.1 | **Keine Sequenz je Bestellung.** Nur `occurred_at` (timestamptz); zwei Events mit gleichem Zeitstempel sind nicht deterministisch geordnet — schlecht für Audit-Trail und Event-Replay. | wichtig | `seq bigint` (globaler `BIGSERIAL`) **oder** `order_seq int` je Bestellung ergänzen; Reihenfolge nie über `occurred_at` allein. |
| 2.2 | `idempotency_key` ist nullable **ohne** Unique-Constraint. Doppelte/Offline-Aktionen (FA-01 13a, doppelte Quittierung FA-06 4c) sollen wirkungslos sein — dafür braucht es eine Eindeutigkeit. | wichtig | Partieller Index `unique (tenant_id, idempotency_key) where idempotency_key is not null`. |
| 2.3 | **Outbox-Konflikt:** Der In-Process-Verteiler (core-domain) muss verarbeitete Events markieren — das wäre ein `UPDATE` auf eine append-only-Tabelle, die `fluvo_app` gar nicht darf. | wichtig | Dispatch-/Verarbeitet-Zustand in **separater** Tabelle (`event_dispatch`/Outbox-Cursor) halten; `order_events` bleibt reines INSERT/SELECT. |
| 2.4 | Struktur ansonsten vollständig: `type`, `payload` (ohne Personenbezug), `actor`, `occurred_at`, `order_id` optional. Rolle `fluvo_app` = nur INSERT/SELECT ist explizit notiert — gut. | hinweis | `actor` als Text `user:<id>` verliert Referenzintegrität (kein FK); für Klasse b bewusst als reine ID akzeptabel — so dokumentieren. |

## 3 · Idempotenz

| # | Befund | Schwere | Empfehlung |
|---|---|---|---|
| 3.1 | `voice_calls.idempotency_key` (Pflicht) je Anruf vorhanden — gut. Eindeutigkeit aber nicht als Constraint definiert. | wichtig | `unique (tenant_id, idempotency_key)` (bzw. global, da vor Tenant-Auflösung) — sonst kann ein Wiederholungsversuch doch eine zweite Bestellung erzeugen. |
| 3.2 | Offline-Aktionen (ADR 0013: Warteschlange bleibt gebaut) landen als `order_events` — hängt an 2.2. Kein eigener Ablageort nötig, aber die Eindeutigkeit ist Pflicht. | hinweis | Mit 2.2 erledigt. |
| 3.3 | `print_jobs` hat **keinen** Idempotenz-/Dedupe-Schutz. Race „Quittierung + 2-Min-Timeout" oder doppelte Quittierung (FA-06 4c: keine Zusatz-Exemplare) kann zwei Aufträge erzeugen. | wichtig | Eindeutigkeit z. B. `unique (tenant_id, order_id, copy_label, bon_type)` bzw. Idempotenz über den auslösenden Event-Key. |

## 4 · Eingefrorene Preise / nachrechenbare Summe

| # | Befund | Schwere | Empfehlung |
|---|---|---|---|
| 4.1 | Unklar, ob `unit_price_cents`/`line_total_cents` **brutto oder netto** sind, und **kein Steuerbetrag je Position** gespeichert. Für Beleg/GoBD/DSFinV-K muss die USt-Aufteilung je Steuersatz nachrechenbar sein. | wichtig | Festlegen: Preis = **brutto** (Gastro-üblich); je Position den enthaltenen Steuerbetrag speichern *oder* garantieren, dass `tax_rate` + Rundungsregel ihn deterministisch reproduziert. Vor der ersten Zeile (unveränderlich!). |
| 4.2 | `options_snapshot` als opakes `jsonb` — ohne festes Schema ist die Summe nicht verlässlich nachrechenbar (Aufpreis je Extra/Variante). | wichtig | jsonb-Struktur per Zod fixieren: je Option `name` + `surcharge_cents`, sodass `line_total = (unit_price + Σ surcharge) × quantity` prüfbar bleibt. |
| 4.3 | Liefergebühr als Wert an `orders` eingefroren — gut. `subtotal`/`total` ableitbar. Keine Rabatte (FEST 11) — gut. Währung implizit EUR. | hinweis | Rundungsregel an *einer* Stelle im Kern; Währung als Annahme dokumentieren (Single-Currency). Optional nullable `source_item_id` an `order_items` für Auswertung (nicht für Preisbildung). |

## 5 · Trennung `orders` (b) vs. `order_customer_details` (a)

| # | Befund | Schwere | Empfehlung |
|---|---|---|---|
| 5.1 | 1:1 über `order_id` als PK/FK, Personendaten isoliert — Löschung „Personenbezug weg, Beleg bleibt" funktioniert technisch. Sehr gut. | hinweis | Beibehalten. |
| 5.2 | Löschweg nicht festgelegt: **Zeile löschen** vs. **pseudonymisieren**. `contact_name` ist NOT NULL → In-place-Pseudonymisierung braucht Platzhalter. | wichtig | Empfehlung: ganze `order_customer_details`-Zeile löschen (saubere Trennung, NOT-NULL bleibt konsistent). `customer_id`-FK auf `ON DELETE SET NULL`, wenn der Stammkunde nach Frist entfällt. |
| 5.3 | **Bon-Nachdruck nach Löschung** unbestimmt: `print_jobs`→`order_id`, aber Name/Adresse sind dann weg — was druckt ein Reprint eines Liefer-Bons? | hinweis | Verhalten festschreiben: Reprint zeigt Bestellung + Positionen + Summen, **ohne** Name/Adresse/Telefon (Belegfunktion). Getrennt vom Papier-Stationsexemplar (Q20). |

## 6 · Zeit-/Geld-Typen

| # | Befund | Schwere | Empfehlung |
|---|---|---|---|
| 6.1 | **`tenants` hat keine Zeitzone.** `opening_hours` (`time`), `closures`, `requested_time`, `acceptance_stops.auto_end_at` („Ladenschluss") und jede Tagesgrenze (Tagesübersicht, Abschluss) brauchen die Tenant-Zeitzone (Europe/Berlin). | wichtig | `tenants.timezone` (IANA) ergänzen; ohne sie sind Vorbestellung, Öffnungsprüfung und Tagesabschluss nicht korrekt interpretierbar. |
| 6.2 | Geld durchgängig `*_cents` (Ganzzahl) — vollständig geprüft, korrekt. Zeitpunkte `timestamptz` (UTC) — korrekt. Dauer: `duration_seconds` (Sek.), Liefer-/Abholzeit in Minuten-Rastern. | hinweis | Minuten-Raster (15er/10er) sind Anzeigewerte — als solche dokumentieren; Regelvorgabe „Dauer in Sekunden" gilt für Messwerte (Metering) und ist eingehalten. |

## 7 · Heiße Indizes / Abfragen

| # | Befund | Schwere | Empfehlung |
|---|---|---|---|
| 7.1 | **`print_jobs` hat kein `device_id`/Ziel-Drucker.** CloudPRNT-Polling (alle paar Sekunden je Drucker) kann seine offenen Aufträge nicht filtern; bei mehreren Druckern (Station/Tresen) nicht zustellbar. | wichtig | `device_id` (Drucker) an `print_jobs`; Index `(tenant_id, device_id, status) where status='pending'`. |
| 7.2 | **Kassensturz-Zuordnung unsicher:** `orders` trägt `collected_by`, aber **kein `shift_id` und kein `collected_at`**. Abschluss je Mitarbeiter (FA-16: Soll = Summe `collected_cash_cents` in *dieser Schicht*) müsste per Zeitfenster-Join geschätzt werden — bei später Übergabe fehleranfällig. | wichtig | `orders.shift_id` (oder mindestens `collected_at timestamptz`) ergänzen; dann Abschluss = `sum … where shift_id = X`, sauber indizierbar, kein Zeitfenster-Join. |
| 7.3 | Keine konkreten Indizes im Artefakt (konzeptbedingt ok), aber Felder für die heißen Pfade weitgehend da: Tagesübersicht `(tenant_id, created_at)`, offene `where status='received'`, Vorbestellungen `(tenant_id, requested_time) where is_preorder`. | hinweis | Indizes bei der Übersetzung ergänzen, alle mit `tenant_id` beginnend; `CONCURRENTLY` in Migrationen. |
| 7.4 | Vorbestellungs-Fälligkeit + Löschfristen laufen als pg-boss-Jobs **ohne Session-Tenant**. | wichtig | Job iteriert Tenant für Tenant (`withTenant` je Tenant) bzw. setzt `tenantId` aus dem Payload — nie `BYPASSRLS`. Als Regel in K6 verankern. |

## 8 · PostGIS / Zonen

| # | Befund | Schwere | Empfehlung |
|---|---|---|---|
| 8.1 | Modell nutzt **bewusst kein** PostGIS-Polygon: Zonen sind **Ortsteile** (Name), Zuordnung Adresse→Ortsteil per Geocoder (Q6). Das ist **konsistent mit FA-17 B18** (Sirats Entscheidung „nicht als gezeichnete Fläche"). Die generische Regel „ST_Contains mit GiST" gilt hier bewusst nicht. | hinweis | So dokumentieren, dass die Abweichung von der PostGIS-Regel eine begründete FA-17-Entscheidung ist, nicht ein Versäumnis. |
| 8.2 | Determinismus der Zone hängt jetzt an einem **externen Geocoder** (Q6). Das ist ein neuer Unterauftragsverarbeiter (Datenschutz) und muss serverseitig-deterministisch sein (KI rät nie). | wichtig | Q6 vor Pilotstart klären (Anbieterwahl → Rückfrage/`open-questions`); Adresse→Ortsteil in deterministischem Code, nicht im LLM. |
| 8.3 | „Außerhalb aller Zonen" (Ausnahme, Annahme liefert von Hand, Gebühr handeingegeben) ist über `delivery_zone_id` nullable + `orders.delivery_fee_cents` abbildbar — gut. | hinweis | Beibehalten; kein Geometrie-Feld nötig. Falls später Radius/Polygon gewünscht: dann erst `geometry` + GiST. |

## 9 · Fehlt / zu viel für den Durchstich

**Fehlt (für Anruf→Bestellung→Bon + Tresen nötig):**
- `tenants.timezone` (6.1) · `unique (tenant_id, order_number)` + Vergabe (1.2) · `print_jobs.device_id` (7.1) · `orders.shift_id`/`collected_at` (7.2) · Sequenz auf `order_events` (2.1) · Unique auf Idempotenz-Keys (2.2/3.1) · Brutto/Netto + Steuerbetrag je Position (4.1) · Outbox/Dispatch getrennt von `order_events` (2.3) · Voice-Webhook-Mapping-Tabelle (1.5).

**Zu viel / auf Vorrat — aber vertretbar:**
- `orders.driver_id`, `orders.payment_method` bewusst leer (ADR 0008: „beide Wege möglich halten") — **behalten**, kein Befund.
- `menu_item_variants` und größenabhängiger `menu_options.surcharge_cents` sind **OFFEN** (Q26) — nicht bauen, bis Sirat das Options-/Varianten-Modell entschieden hat (sonst friert `order_items` eine unklare Struktur ein).
- Voller Statusumfang „vorgesehen" bei Piloten-Teilmenge (K3) — ok, Status-Liste erweiterbar halten (kein DB-Enum).

## Drei Dinge, die vor dem ersten Migrationsskript zwingend entschieden sein müssen

1. **Schlüssel- und Integritätsmodell (nicht nachrüstbar).** Zusammengesetzte FKs `(tenant_id, id)` mit passenden zusammengesetzten Uniques auf allen Elterntabellen — ja/nein; dazu die je-Tenant-Eindeutigkeiten `unique (tenant_id, order_number)`, `unique (tenant_id)` auf `menus`, `unique (tenant_id, idempotency_key)` und die global-eindeutigen Lookup-Schlüssel (`token_hash`, `provider_call_id`). Das prägt PK/Unique jeder Tabelle und ist nach befüllter DB kaum änderbar.
2. **Semantik der unveränderlichen Zeilen: Geld/Steuer + Zeit.** `unit_price` = brutto oder netto, Steuerbetrag je Position speichern oder deterministisch nachrechenbar, Rundungsstelle, Währung — **plus `tenants.timezone`**. Muss stehen, bevor die erste `orders`/`order_items`-Zeile (GoBD, 10 Jahre) geschrieben wird, denn diese Zeilen werden nie umgeschrieben.
3. **`order_events` als Audit-Trail + Outbox.** Sequenz je Bestellung, eindeutiger `idempotency_key`, Ablage von Dispatch-/Verarbeitet-Zuständen **außerhalb** der append-only-Tabelle, und Rollenrechte `fluvo_app` = nur INSERT/SELECT (UPDATE/DELETE entzogen). Eine falsch angelegte `order_events`-Migration ist wegen der Unveränderlichkeit praktisch nicht korrigierbar — diese Struktur muss beim allerersten Migrationsschritt richtig sein.

---

*Bericht vom `database-reviewer` als Text an Jarvis geliefert und von Jarvis unverändert hier abgelegt (2026-09-23). Keine Artefakte geändert, nichts aus dem Business Brain verwendet.*
