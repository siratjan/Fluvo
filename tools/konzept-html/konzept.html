# Architekturbild fluvo — Durchstich für den Piloten

> **Status:** Entwurf (architect, 2026-09-23) — mit Sirat noch nicht durchgegangen.

**Zweck:** Ein Bild, das ohne Entwicklerausbildung lesbar ist und zeigt, *welche Technik* fluvo benutzt, *wie die Teile zusammenhängen* und *wie das System wächst*. Grundlage: [briefing.md](../../briefing.md) §4 und §5 (nicht geändert), aktualisiert um die jüngsten Entscheidungen ADR [0008](../../decisions/0008-fahrer-teil-spaeter-zwei-bons.md) bis [0013](../../decisions/0013-internetausfall-papier-statt-offline-warteschlange-im-piloten.md). Dieses Bild erfindet nichts Neues; wo etwas offen ist, steht ein Verweis auf eine Q-Nummer in [open-questions.md](../../open-questions.md).

*Fachbegriffe sind mit einem Halbsatz erklärt. „PD" markiert einen Weg, auf dem **personenbezogene Daten** (Name, Adresse, Rufnummer) fließen — jeder solche Weg braucht später in K9/DSFA eine Begründung.*

---

## 1. Gesamtbild

**Konvention:** Durchgezogene Linie = im Piloten-Durchstich gebaut. Gestrichelt = kommt später. Kantenbeschriftung mit **PD** = auf diesem Weg fließen personenbezogene Daten.

```mermaid
flowchart LR
  caller["Anrufer im Telefonnetz"]
  retell["Voice-Anbieter Retell - hinter VoiceProvider-Adapter"]

  subgraph monolith["fluvo-Server - ein Prozess, eine Codebasis, ein Deployment (Fastify)"]
    direction TB
    voice["Modul voice - Webhook plus Function Calls"]
    intake["Modul intake - manuelle Annahme"]
    printing["Modul printing - CloudPRNT und Bon-Layout"]
    core["core - der Kern - Bestellung, Zustandsmaschine, Speisekarte, Preise, Event-Log"]
    voice --> core
    intake --> core
    core --> printing
  end

  db[("PostgreSQL - eine Datenbank - tenant_id plus Row-Level-Security")]
  annahme["Annahme-PWA im Laden - Tablet, Offline-Cache"]
  printer["Star-Drucker im Laden - fragt den Server ab"]

  caller -->|"PD Sprache, Name, Adresse"| retell
  retell -->|"PD Function Calls z. B. create_order"| voice
  core -->|"createOrder, Zustandswechsel"| db
  printing -->|"PD Bon mit Name, Adresse, Rufnummer"| printer
  printer -.->|"CloudPRNT Polling - Drucker fragt alle paar Sekunden"| printing
  annahme <-->|"PD Bestellungen live per WebSocket"| core

  website["Website Astro - spaeter"]:::later
  fahrer["Fahrer-PWA - spaeter, ADR 0008"]:::later
  tse["TSE fiskaly - spaeter"]:::later
  payment["Zahlung Mollie oder Stripe - spaeter"]:::later
  website -.->|"PD Online-Bestellung"| core
  fahrer -.->|"PD QR, Lieferadresse"| core
  core -.-> tse
  core -.-> payment

  classDef later stroke-dasharray: 5 5,color:#777,stroke:#999;
```

### Dasselbe in Worten

| Baustein | Was er ist (Halbsatz) | Verbindet sich mit | PD? |
|---|---|---|---|
| Anrufer im Telefonnetz | der Kunde, der anruft | Voice-Anbieter | ja |
| Voice-Anbieter Retell | fremder Dienst, der den Anruf annimmt und mit der KI spricht; **hinter einem Adapter** (austauschbare Zwischenschicht), damit ein Anbieterwechsel den Kern nicht berührt | fluvo-Server (Modul `voice`) | ja |
| fluvo-Server (Fastify) | ein einziges dauerlaufendes Programm — der **modulare Monolith**: ein Kern plus Module, die nur vom Kern abhängen | Datenbank, PWA, Drucker | — |
| `core` (Kern) | das Herz: legt jede Bestellung über **einen** Befehl `createOrder` an, schaltet ihren Zustand weiter, kennt Speisekarte und Preise, schreibt jedes Ereignis unveränderlich ins Event-Log | Datenbank, Module | — |
| Modul `voice` | nimmt die Rückmeldungen des Voice-Anbieters entgegen (Webhook = „der Fremddienst ruft fluvo zurück") und beantwortet dessen Function Calls (die KI fragt Preise/Adresse gegen die echte API ab) | Kern | ja |
| Modul `intake` | die manuelle Annahme — ein Mensch tippt eine Bestellung ein, über **denselben** Kern-Befehl wie die KI | Kern | ja |
| Modul `printing` | baut den Bon und bedient den Drucker per CloudPRNT | Drucker | ja |
| PostgreSQL | **eine** Datenbank für alle Restaurants; jede Zeile trägt `tenant_id`, und die Datenbank selbst sperrt fremde Mandanten aus (**Row-Level-Security**, kurz RLS = „Zeilen-Schutz in der DB") | Kern | ja (gespeichert) |
| Annahme-PWA | die Weboberfläche im Laden auf einem Tablet (PWA = „installierbare Web-App", läuft auch kurz offline); zeigt Bestellungen live | Kern (per WebSocket = dauerhafte Live-Verbindung) | ja |
| Star-Drucker | der Bondrucker; **er fragt den Server ab** (CloudPRNT-Polling), es läuft keine Software im Laden | Modul `printing` | ja (Bon) |
| Website, Fahrer-PWA, TSE, Zahlung | **später** (gestrichelt) — nicht Teil des ersten Durchstichs | Kern | teils |

Offen an diesem Bild: der **Geocoder** (Dienst, der eine Adresse einer Zone zuordnet) fehlt im Stack und liegt im Anruf-Pfad → Q6. Die **Telefonie/Rufumleitung** zwischen Anrufer und Retell ist noch nicht getestet → Q1, Q15.

## 2. Technologie je Baustein — und warum [STACK]

Aus Briefing §4 übernommen. Diese Wahl ist **Arbeitsgrundlage [STACK]**, kein [FEST] — abweichen nur mit Begründung, Rückfrage an Sirat und ADR.

| Baustein | Wahl | Warum diese Wahl (ein Satz für Sirat) |
|---|---|---|
| Sprache | **TypeScript**, Monorepo mit **pnpm** | Eine einzige Sprache für Server, Oberflächen und Website — ein Solo-Gründer muss nur einen Werkzeugkasten pflegen. |
| Prüfung von Daten | **Zod**-Schemas in einem geteilten Paket | Bestellung und Speisekarte sind **einmal** definiert und werden überall gleich geprüft — keine zweite Wahrheit. |
| Server | **Node.js + Fastify**, dauerhaft laufend (nicht serverless) | Live-Verbindungen, Voice-Rückmeldungen und das Drucker-Abfragen brauchen ein Programm, das immer läuft. |
| Datenbank | **PostgreSQL** + **Drizzle** (Übersetzer zwischen Code und DB) + **PostGIS** (Landkarten-Erweiterung für Liefergebiete) | Eine robuste Standard-Datenbank kann Mandantentrennung, Geodaten und Audit selbst — kein Extra-System nötig. |
| Ereignisse/Audit | Append-only-Tabelle `order_events` (nur anfügen, nie ändern) | Das Ereignisprotokoll ist zugleich der gesetzlich geforderte Prüfpfad (GoBD) — Kafka o. Ä. wäre unnötiger Ballast. |
| Hintergrund-Aufgaben | **pg-boss** (nutzt Postgres) | Zeitgesteuerte Jobs ohne ein zweites System wie Redis. |
| Zustandsmaschine | einfache Übergangstabelle **im Code, nur im Kern** | Der Server entscheidet jeden Schritt selbst; keine Zusatz-Bibliothek, weniger bewegliche Teile. |
| Oberflächen (Annahme, später Küche/Fahrer/Admin) | **React + Vite** als PWAs, Live per WebSocket | Installierbar ohne App-Store, laufen kurz offline (Service Worker + lokaler Speicher IndexedDB). |
| Website | **Astro**, ein Template, Domains über **Caddy** (Webserver, holt HTTPS-Zertifikate selbst) | Ein wartbares Muster für alle Restaurant-Websites statt vieler Einzelseiten. |
| Online-Zahlung | **Mollie** oder **Stripe Checkout** (gehostete Zahlseite) | fluvo berührt nie Kartendaten — die Zahlung läuft auf der Seite des Anbieters (Q7). |
| Voice | **Retell** hinter `VoiceProvider`-Adapter | Voice kaufen statt bauen; der Adapter macht einen Anbieterwechsel möglich, ohne den Kern umzubauen. |
| Bon-Druck | **Star CloudPRNT** (Drucker fragt den Server ab) | Keine Software im Laden zu installieren und zu warten. |
| TSE (Kassen-Sicherung) | **fiskaly** per API, hinter `FiscalProvider`-Adapter | Cloud-TSE statt eigener Hardware; austauschbar. |
| SaaS-Abrechnung | **Stripe Billing** mit Metern (nutzungsbasiert) | Rechnet die verbrauchten KI-Minuten automatisch ab. |
| Hosting | **Hetzner (Deutschland)**, Docker, Deploy mit Coolify oder Kamal | EU-Hosting; Docker hält die Wahl „selbst betreiben oder Managed-Dienst" offen. |
| Überwachung | **Sentry** (EU-Region), strukturierte Logs **ohne** Personendaten | Fehler früh sehen — ohne dass Kundendaten in Logs geraten. |
| Login | Inhaber per E-Mail-Link; Personal per PIN bzw. QR-Token | Kein Passwort-Aufwand für wechselndes Personal (Q11). |

**Verworfen** (Briefing §4): Supabase + Next.js, Make/Notion/Airtable als Produktivsystem, Python/FastAPI (nur für einen späteren eigenen Voice-Stack, der ohnehin getrennt liefe).

## 3. Was im ersten Durchstich gebaut wird — und was später

Ziel des Durchstichs: **Anruf → Bestellung → gedruckter Bon** (Briefing §7). Der Fahrer-Teil kommt **nach** dem ersten Piloten (ADR [0008](../../decisions/0008-fahrer-teil-spaeter-zwei-bons.md)); der Internetausfall wird im Piloten mit Papier überbrückt, nicht mit der Warteschlange (ADR [0013](../../decisions/0013-internetausfall-papier-statt-offline-warteschlange-im-piloten.md)).

| Repo-Baustein (Briefing §5.1) | Im Durchstich? | Rolle im Durchstich |
|---|---|---|
| `packages/core` | **ja** | Bestellung, Zustandsmaschine, Speisekarte, Preise, Event-Log, Entitlements — die nicht verhandelbare Grundlage. |
| `packages/schemas` | **ja** | Die eine Definition jeder Datenform (Zod), von allen genutzt. |
| `packages/db` | **ja** | Datenbankschema und Migrationen inkl. `tenant_id` + RLS; die Tabellen für später (`fiscal_transactions`, Teilzahlungen, Fahrer-Zuordnung) werden **schon jetzt angelegt**, bleiben im Piloten aber leer (K5, ADR 0008 Folgen). |
| `modules/voice` | **ja** | Retell-Adapter, Function Calls, Minuten-Zählung — gegen die Sandbox (Testumgebung des Anbieters). |
| `modules/printing` | **ja** | Bon-Druck über CloudPRNT; bei Lieferung **zwei Exemplare** (ADR 0008). |
| `modules/intake` | **ja (minimal)** | Manuelle Annahme über denselben `createOrder`. |
| `apps/api` | **ja** | Der Fastify-Server, der den Monolithen ausliefert. |
| `apps/web-staff` | **ja (minimal)** | Nur die Annahme-Ansicht; Küche/Fahrer/Admin-Ansichten später. |
| `modules/fiscal` | **später** | TSE-Anbindung als Code; die *Datenfelder* existieren aber ab Tag 1. Fiskalische Klärung → Q2 (Steuerberaterin, vor Pilotstart). |
| `modules/billing` | **später** | SaaS-Abrechnung der fluvo-Kunden. |
| `modules/driver` | **später** | Fahrer-App, eigene App nach dem Piloten (ADR 0008; berührt [FEST 17] → Q19). |
| `apps/site` (Website) | **später** | Provisionsfreier Bestellkanal. |
| Zahlung (`PaymentProvider`) | **später** | Online-Zahlung (Q7). |
| `modules/privacy` | **später (Grundlage jetzt)** | Auskunft/Löschung per Rufnummer; die Datenklassen dafür stehen ab K5. |

## 4. Wie es skaliert — ehrlich

**Wichtigster Satz zuerst:** fluvo bleibt ein **modularer Monolith [FEST 1]** — eine Codebasis, eine Datenbank, ein Deployment. Skaliert wird durch **einen größeren Server, Lesekopien der Datenbank und mehr Instanzen derselben Codebasis** — **nicht** durch Microservices. Microservices sind für einen Solo-Gründer kein Weg: sie vervielfachen die beweglichen Teile, ohne bei diesem Lastprofil einen Nutzen zu bringen.

### 4.1 Voraussetzung: Mandantentrennung ermöglicht Skalierung

Dass **jede Tabelle `tenant_id` trägt und die Datenbank fremde Mandanten per RLS aussperrt** (Briefing §5.2, Regel 6), ist nicht nur Sicherheit — es ist die **Voraussetzung zum Wachsen**: Nur so teilen sich **viele** Restaurants *eine* Datenbank und *ein* Deployment sicher. Ohne saubere Mandantentrennung müsste man je Kunde eine eigene Installation betreiben — das Gegenteil von Skalierung. Deshalb ist die Trennung im Kern von Anfang an nicht verhandelbar.

### 4.2 Was ein einzelner Server + eine Postgres grob trägt

*Die folgenden Zahlen sind eine **begründete Schätzung**, ausdrücklich **keine Messung.** Sie dienen nur der Größenordnung und müssen mit der echten Karte und einem Lasttest belegt werden.*

**Annahmen:** Ein Restaurant wie der Pilot macht ~120 Bestellungen/Tag, verteilt über mehrere Stunden mit Spitzen um die Essenszeiten. Selbst in der Spitze sind das grob **eine Bestellung pro Minute** — je Bestellung ein `createOrder` und wenige Ereignisse, also sehr wenige Schreibvorgänge. Eine mittelgroße Hetzner-Maschine (wenige Rechenkerne, ~16–32 GB Speicher) mit einer PostgreSQL bewältigt einfache Transaktionen dieser Art mit großem Abstand.

**Schätzung (so markiert):** Die begrenzende Größe ist **nicht** die Rechenlast pro Bestellung, sondern die Zahl der **gleichzeitig offenen Verbindungen** (Live-Verbindungen der Tablets, Drucker-Abfragen, Datenbank-Verbindungen). Unter diesen Annahmen erscheint eine Größenordnung von **grob mehreren Dutzend bis wenige hundert Restaurants** dieser Größe auf **einem** Server plus **einer** Postgres plausibel — bevor der erste Ausbauschritt nötig wird. Diese Spanne ist bewusst weit und **muss** durch Messung ersetzt werden.

### 4.3 Wo die ersten Grenzen liegen — und welcher Schritt hilft

| Grenze (Reihenfolge grob nach Eintritt) | Warum | Erster Schritt, der hilft |
|---|---|---|
| **Voice-Anbieter-Kontingent und -Kosten** | Retell begrenzt gleichzeitige Anrufe und rechnet **pro Minute** ab — der Preis (Kostenampel: tragfähig bis 0,15 €/Min, kritisch über 0,20 €) trifft das Geschäftsmodell, **bevor** der Server an eine Grenze kommt. Das ist eine **externe** Grenze, kein fluvo-Server-Problem. | Kontingent beim Anbieter erhöhen; Kosten je Minute beobachten (Q9); der Adapter erlaubt später einen anderen Anbieter oder einen eigenen Voice-Stack (dann ein **getrennter** Dienst, Briefing §4). |
| **PostgreSQL-Verbindungen** | Server, Hintergrund-Jobs (pg-boss) und Live-Verbindungen brauchen je eine DB-Verbindung; Postgres verträgt nicht beliebig viele gleichzeitig. | Einen **Verbindungs-Pooler** davorsetzen (bündelt viele Anfragen auf wenige DB-Verbindungen), dann eine **größere** DB-Maschine. |
| **WebSockets (Live-Verbindungen)** | Jedes Tablet hält eine dauerhafte Verbindung; mit vielen Restaurants steigt der Speicherbedarf des einen Server-Prozesses. | Zuerst **größerer Server**; dann **mehrere Instanzen derselben Codebasis** hinter einem Lastverteiler (weiter ein Monolith, nur mehrfach gestartet). |
| **Drucker-Polling-Last** | Jeder Drucker fragt alle paar Sekunden den Server ab; viele Drucker ergeben viele kleine Anfragen. | Abfrage-Intervall maßvoll wählen; die Polling-Last später als **zweiten Prozess derselben Codebasis** abtrennen (siehe unten). |
| **Lese-Last (Speisekarte, Monitoring)** | Viele Lesezugriffe (Karte, Gesundheitswerte) können die eine DB belasten. | Eine **Read-Replica** (Lesekopie der Datenbank) für Lesezugriffe. |

### 4.4 Der Ausbauweg in Stufen

1. **Größerer Server** (vertikal) — der einfachste und erste Schritt.
2. **Read-Replica** — eine Lesekopie der Datenbank nimmt Lesezugriffe ab.
3. **Voice-Webhooks als zweiter Prozess derselben Codebasis** — der zeitkritische Anruf-Pfad wird von der Oberflächen-/Live-Last getrennt, indem **dieselbe** Anwendung ein zweites Mal mit einem anderen Einstiegspunkt gestartet wird. Das ist **kein** Microservice: gleiches Repo, gleiche Datenbank, gleiches Deployment-Artefakt — nur mehrfach gestartet. So bleibt [FEST 1] gewahrt.

Erst weit jenseits des Pilotbereichs käme eine Aufteilung der Datenbank je Mandant in Betracht — das ist ausdrücklich **nicht** Gegenstand des Durchstichs.

---

## 5. Betrieb

Aus Briefing §4 und §6.

- **Hosting:** Hetzner in Deutschland (EU), alles in **Docker** (Container = abgeschlossene, überall gleich startende Programmpakete). Deploy mit Coolify oder Kamal.
- **Datenbank:** eine PostgreSQL; wahlweise selbst betrieben oder als Managed-Dienst eines EU-Anbieters (Docker hält beides offen, Q — „selbst vs. managed" im Briefing §8).
- **Backups:** **täglich und getestet** — ein Backup, das nie zurückgespielt wurde, zählt nicht.
- **Monitoring:** Sentry (EU-Region) für Fehler, strukturierte Logs **ohne** personenbezogene Daten (Regel 8, security.md).

**Minimal für den Piloten reicht:** **ein** Hetzner-Server mit Docker, **eine** PostgreSQL mit getäglichem, getestetem Backup, Sentry (EU) und eine einfache Erreichbarkeitsprüfung. Read-Replica, Pooler und ein zweiter Prozess (Abschnitt 4.4) sind erst bei Wachstum nötig — nicht im Piloten.

---

## 6. Offene Punkte

Nichts davon wird hier entschieden — Verweise auf [open-questions.md](../../open-questions.md):

- **Q1 · Rufumleitung / Telefonie:** Kommt die Anrufernummer an? Betrifft die Kante Anrufer → Retell. Test AP-001 (Termin 2026-09-25).
- **Q5 · Große Speisekarten im Voice-Prompt:** kann Größe, Kosten und Latenz treiben — Messung mit der echten Karte.
- **Q6 · Geocoder für `validate_address`:** fehlt im Stack, liegt im Anruf-Pfad, ist ein neuer Unterauftragsverarbeiter (EU-Standort). Betrifft die Zone-Zuordnung.
- **Q7 · Online-Zahlung:** Mollie oder Stripe — später, hinter `PaymentProvider`-Adapter.
- **Q8 · Lokaler Bon-Druck ohne Internet:** Test AP-002; im Piloten sonst Nachdruck + handgeschriebener Zettel (ADR 0013).
- **Q9 · Kostenampel:** Was steckt in den 0,13 €/Min? Betrifft die Voice-Grenze in Abschnitt 4.3.
- **Q11 · Login/Gerätebindung:** PIN/QR-Token, Gerätebindung — betrifft die Annahme-PWA.
- **Q13 · Statuskette und Bestellarten:** die feste Kette passt noch nicht auf alle Bestellarten → K3 mit `architect`, berührt [FEST 2].
- **Q15 · KI außerhalb der Öffnungszeit vs. Rufumleitung:** deterministische Trennung, hängt an AP-001.
- **Selbst betriebener Server vs. Managed-Dienst** (Briefing §8): Docker hält beides offen; Sirat entscheidet nach Betriebserfahrung.

# K3 · Zustandsmodell der Bestellung (Piloten-Durchstich)

**Status:** Entwurf — Gegenlesen `architect` 2026-09-23 eingearbeitet; Durchgang mit Sirat und Entscheidung Q13 stehen aus

**Zweck:** Festlegen, welche Zustände eine Bestellung im **Piloten** durchläuft, wer welchen Übergang auslöst, was er bewirkt und wie Storno, Doppelklick, Notdruck und „Rückruf nötig" abgebildet werden. Maßgeblich ist die **Übergangstabelle**; weicht sie vom Diagramm ab, ist das ein Befund.

> **Berührt [FEST 2] / Briefing §5.3 — nicht still überschrieben.** Die feste Kette lautet `Eingegangen → In Küche → Fertig → Unterwegs → Geliefert → Abgerechnet` mit Storno als eigenem Pfad. Der Piloten-Schnitt (ADR 0006/0008/0010/0013) benutzt davon nur eine **Teilmenge** und ergänzt zwei Enden (Tresen-Übergabe, Ende ohne Bezahlung). Dieser Entwurf ist ein **Vorschlag** zu **Q13** und muss von `architect` gegengelesen und von Sirat entschieden werden, bevor er über den Piloten hinaus gilt. Die vollen Zustände bleiben im Datenmodell (K5) vorgesehen.

## Zustandsdiagramm (Pilot)

```mermaid
stateDiagram-v2
    direction LR
    [*] --> received : order.created
    received --> delivered : order.delivered
    received --> handed_over : order.handed_over
    received --> ended_unpaid : order.ended_unpaid
    received --> cancelled : order.cancelled
    delivered --> cancelled : order.cancelled
    handed_over --> cancelled : order.cancelled
    delivered --> [*]
    handed_over --> [*]
    ended_unpaid --> [*]
    cancelled --> [*]

    note right of received
      Merkmale (kein Zustand):
      quittiert / unquittiert [KI, ADR 0010],
      Bestellart, Vorbestellung + Wunschzeit,
      Test, Notiz, Zahlung.
      order.amended = neues Ereignis, kein Statuswechsel.
    end note
```

**Legende / Zustände im Piloten**

| Zustand (Code / Deutsch) | Bedeutung | Terminal? |
|---|---|---|
| `received` / Eingegangen | Bestellung ist angelegt (Startzustand jeder Bestellung, jeder Bestellart). Küchen-Status werden im Piloten **nicht** gesetzt, die Bestellung bleibt hier bis zum Endübergang. | nein |
| `delivered` / Geliefert | Lieferung: die Annahme hat „geliefert" gedrückt (kein Fahrer, keine Zahlart im System, ADR 0008). | ja |
| `handed_over` / Übergeben und bezahlt | Abholung/Mitnehmen: am Tresen übergeben **und** bezahlt (bar/Gutschein, FA-15). | ja |
| `ended_unpaid` / Ohne Bezahlung beendet **[VORSCHLAG]** | Nie abgeholt/nie kassiert: Ende mit Pflichtgrund durch Annahme oder Inhaber (FA-15/FA-16). Eigenes Ende **oder** Teil des Storno-Pfads → offen (Q3). | ja |
| `cancelled` / Storniert | Storno als eigener, protokollierter Pfad, mit Grund und Akteur (FA-11). | ja |

**Erst mit dem Fahrer-Teil / später (nicht Teil dieses Modells, ADR 0008; Q13):**
`in_kitchen` / In Küche und `ready` / Fertig — im Piloten **nicht von Hand gesetzt** (keine Küchen-Status); `out_for_delivery` / Unterwegs — **kein Fahrer** im Piloten; `settled` / Abgerechnet — im Piloten **kein** Bestellstatus (die Geldabrechnung ist ein Aggregat je Mitarbeiter, FA-16, und ändert keinen Bestellstatus; Verhältnis „Geliefert → Abgerechnet" für Lieferungen ohne erfasste Zahlung ist offen, Q13).

**Zukunftssicherheit — Vorgabe für K5/Code.** Das spätere Einschieben der FEST-Zustände (`in_kitchen`/`ready`/`out_for_delivery`/`settled`) **zwischen** `received` und den heutigen Enden ist unkritisch, weil das Event-Log **Tatsachen** protokolliert, nicht den Graphen: historische `order_events` bleiben gültig, egal wie die Übergangstabelle später aussieht ([FEST 7], kein Daten-Rückbau). Damit das trägt, gelten drei Vorgaben:

- **`OrderStatus` als String-Literal-Union aus dem Zod-Schema plus Textspalte** (ggf. mit CHECK-Constraint, per neuer Migration ersetzbar) — **kein** Postgres-`ENUM`-Typ (schwer erweiter- und umsortierbar; deckt sich mit `typescript.md` „keine enums").
- **„offen" vs. „terminal" nicht an einzelne Statuswerte binden.** Nicht `status = 'received'` als „offen" verdrahten, sonst brechen Monitoring/Listen beim Einschieben neuer Zustände. Stattdessen **abgeleitete Mengen** `OPEN_STATES` / `TERMINAL_STATES` an **einer** Stelle im Kern definieren.
- **Ereignisnamen bleiben bedeutungsstabil** (`order.delivered` heißt „Lieferung abgeschlossen" — bleibt gültig, auch wenn später `out_for_delivery → delivered` davorsteht); jedes Übergangs-Event trägt `from`/`to` im Payload, damit der Trail bei wachsender Tabelle lesbar bleibt.

## Übergangstabelle

| Von → Nach | Auslöser (wer) | Bedingung | Ereignis (K6 vorläufig) | Nebenwirkung | Quelle |
|---|---|---|---|---|---|
| — → `received` | KI/System (FA-01) **oder** Annahme von Hand (FA-05) | KI: ausdrückliche Bestätigung des Anrufers. Hand: Anlegen. Vorher Prüfung Entitlements → Öffnungszeit → Speisekarte → Liefergebiet → Mindestbestellwert; Preise/Texte eingefroren | `order.created` (actor `voice` \| user) | KI: **kein** Sofort-Bon, Annahme-Gerät **signalisiert**. Hand: gilt als **direkt quittiert** → Bon sofort | Briefing §5.3/§5.4, FA-01, FA-05 |
| `received` → `delivered` | Annahme | Bestellart **Lieferung**; die Annahme weiß, dass geliefert wurde | `order.delivered` (actor user) | **Keine** Zahlart, **kein** Bar-Eingang erfasst (Papier, ADR 0008) | ADR 0008 (Runde 26), FA-06, Q13 |
| `received` → `handed_over` | Annahme (angemeldete kassierende Person) | Bestellart **Abholung/Mitnehmen**; am Tresen übergeben; Zahlung ist erfasst (Mitnehmen bereits bei Anlage, Abholung spätestens bei Übergabe) | `order.handed_over` (actor user) | Bareinnahme fließt in den Abschluss je Mitarbeiter (FA-16), **nicht** in einen Fahrer-Kassensturz | FA-15, FA-16 |
| `received` → `ended_unpaid` **[VORSCHLAG]** | Annahme (mit Pflichtgrund) **oder** Inhaber | Bon gedruckt, nie kassiert/übergeben (z. B. nie abgeholt); **Grund Pflicht**; per Definition **ohne** erfasste Zahlung | `order.ended_unpaid` (Grund, actor) | Sichtbar in der Liste nicht kassierter Bestellungen (FA-16); protokolliert im Inhaber-Log | FA-15 (2a), FA-16 (3a), ADR 0010; Q3 |
| `received` → `cancelled` | Annahme, **solange keine Zahlung erfasst**; sonst **nur Inhaber** | Storno; **Grund Pflicht**; Küche organisatorisch abgeklärt (kein Küchen-Status im System). Achtung: ein bezahltes **Mitnehmen** ist `paid` bereits in `received` (FA-15 1a) → Storno = Storno **nach** Zahlung → **nur Inhaber** | `order.cancelled` (Grund, actor) | **Kein** Storno-Bon, **keine** eigene Anzeige; sichtbar in Übersicht/Log; Küche per Zuruf | FA-11, FA-15 (4c), ADR 0007/0009/0010/0011 |
| `delivered` / `handed_over` → `cancelled` | **nur Inhaber** | Storno **aus einem Endzustand** (unabhängig davon, ob eine Zahlung erfasst wurde — bei `delivered` gibt es im Piloten keine, ADR 0008); Grund Pflicht; fiskalische Behandlung **offen** | `order.cancelled` (Grund, actor Inhaber) | Wie oben; Erstattung/Signatur/DSFinV-K **nicht** in diesem Piloten gelöst | FA-11 (4a), ADR 0008, Q3 |

**Merkmal-Übergänge (kein Statuswechsel — Bestellung bleibt `received`)**

| Merkmal | Von → Nach | Auslöser | Ereignis (vorläufig) | Nebenwirkung | Quelle |
|---|---|---|---|---|---|
| quittiert | unquittiert → **quittiert** | Annahme quittiert das Signal (nur KI-Bestellung) | `order.acknowledged` (actor user) | löst den **Bon-Druck** aus (Lieferung 2 Exemplare, sonst 1) | FA-06, ADR 0010 |
| quittiert | unquittiert → **unquittiert gedruckt** (Notdruck) | **Zeit** (2 Minuten ohne Quittierung; Uhr hereingereicht) | `order.printed_unacknowledged` (actor `system`, Grund Timeout) — **eigenes** Ereignis, **nicht** `order.acknowledged` | Bon druckt **trotzdem**, Hinweis „unquittiert gedruckt" an der Annahme; die Bestellung bleibt beweisbar **unquittiert** | FA-06 (2a), ADR 0010; Zahl 2 Min → K8 |
| Zahlung erfasst | nicht erfasst → **Zahlung erfasst** | Annahme (angemeldete kassierende Person) | `order.paid` (bzw. `payment.captured`, K6) — **eigenständig**, an einen Zahlungssatz gebunden, **entkoppelt** von der Erfüllungskante (Teilzahlung je Zahlart möglich) | **kein** Statuswechsel; Mitnehmen bei Anlage, Abholung bei Übergabe; die Bareinnahme fließt in den Abschluss je Mitarbeiter (FA-16); ab hier stornoberechtigt **nur** der Inhaber | FA-15, Briefing §5.2 |
| — (Inhalt) | — (bleibt `received`) | Annahme ändert Bestellung (FA-11) | `order.amended` | neuer Preis vom Server; geänderter Bon **auf Anforderung**; nichts überschrieben | FA-11 |

## Sonderfälle (je ein Satz)

- **Doppelklick / doppelte Quittierung:** Ein bereits angewendeter Übergang oder eine zweite Quittierung ist **wirkungslos, kein Fehler** und erzeugt **keine** zusätzlichen Bon-Exemplare (Idempotenz über Schlüssel/Zielzustand; FA-06 4c, fluvo-core-domain).
- **Offline-Nachzügler:** Im Piloten gibt es **keinen** — beim Internetausfall arbeitet das Personal auf **Papier** ohne Nachtrag, die KI-Annahme pausiert automatisch (ADR 0013); die Warteschlange ([FEST 18]) bleibt als Sicherheitsnetz gebaut, ist aber **nicht** der Arbeitsweg. Falls doch eine Aktion nachgespielt wird, gilt die Konfliktregel: der Server wendet nur **gültige Vorwärts-Übergänge** an, eine verspätete Aktion auf eine inzwischen stornierte Bestellung wird **abgelehnt und für das Personal sichtbar** (nie stumm).
- **Storno — Recht am Merkmal „Zahlung erfasst", nicht am Zustand:** Die **Annahme** storniert frei, **solange keine Zahlung erfasst und kein Endzustand erreicht** ist; sobald eine Zahlung erfasst ist **oder** die Bestellung in einem Endzustand steht, darf **nur der Inhaber** stornieren (FA-11 4a, FA-15 4c, ADR 0010/0011). Wichtiger Grenzfall: ein bezahltes **Mitnehmen** ist bereits im Zustand `received` **bezahlt** (FA-15 1a) — sein Storno ist damit ein Storno **nach** Zahlung → **nur Inhaber**, obwohl der Zustand `received` ist. Bei einer **Lieferung** in `delivered` gibt es im Piloten **keine** erfasste Zahlung (ADR 0008); ihr Storno gehört trotzdem dem Inhaber, weil sie in einem **Endzustand** steht. **Grund immer Pflicht**; die **fiskalische** Zulässigkeit (bis zu welchem Zustand, Erstattung, Signatur, Teilstorno) ist **offen → Q3 (Steuerberaterin)**.
- **Ändern vor/nach Zahlung:** Änderung ist ein **neues Ereignis ohne Statuswechsel** (`order.amended`); **vor** Zahlung ändert die Annahme frei (auch Teilstorno einer Position = Änderung, kein Grund nötig), **nach** erfasster Zahlung → Q3 (FA-11).
- **2-Minuten-Notdruck:** **Zeitauslöser** setzt das Merkmal auf „unquittiert gedruckt" und druckt den Bon trotzdem mit Hinweis — der **Status bleibt `received`** (FA-06 2a; 2 Min → K8).
- **Großbestellung „Rückruf nötig" (FA-01 9b) [VORSCHLAG]:** Bei einer **Sofort**-Großbestellung über der Schwelle legt die KI **nicht** selbst an, sondern übergibt an die Annahme; ist niemand erreichbar, steht sie als **„Rückruf nötig"** an, **kein Bon bis ein Mensch bestätigt**. **Vorschlag — Variante A:** eine **Vor-Anlage außerhalb der Bestell-Zustandsmaschine** — die Vormerkung liegt in einer **eigenen kleinen Tabelle** (z. B. `intake_drafts`/`call_handoffs`) mit `tenant_id` und RLS ([FEST 6]), **nicht** in `orders`; erst die menschliche Bestätigung ruft `createOrder` auf → `received`. Das folgt aus Briefing §5.4 „kein Datensatz vor Bestätigung" und aus [FEST 11] (die KI sagt nichts zu, was Geld kostet). Alternative (Variante B) wäre ein eigener Status `pending_callback` **vor** `received`. → **Frage an Sirat/architect** (Wahl der Variante).

## Nicht erlaubte Übergänge

- **Rückwärts nie.** Kein `delivered → received`, kein `handed_over → received`, kein Rücksprung aus einem Endzustand (Ausnahme: der protokollierte **Storno-Pfad** nach Zahlung durch den Inhaber, oben).
- **„Korrektur" ist kein Rücksprung.** Eine inhaltliche Korrektur ist entweder eine **Änderung** (`order.amended`, kein Statuswechsel) oder — wenn wirklich umgekehrt werden muss — **Storno + Neuanlage** (z. B. Nachbestellung nach bezahltem Mitnehmen = neue Bestellung, FA-11 3f). Ein Endzustand wird nie „zurückgedreht".
- **Die KI löst keinen Statusübergang aus.** Sie ruft nur `createOrder` nach Bestätigung auf und eskaliert (FA-03); jeden Übergang entscheidet der **Server** auf Aktion eines Menschen oder der Zeit ([FEST 2/8]).
- **Kein Übergang ohne Ereignis.** Jeder Statuswechsel schreibt ein Event in `order_events` (append-only, [FEST 6/7]).

## Offene Fragen

**Q13 ist bedingt schließbar (Entscheidung Sirat).** Nach Einarbeitung des Gegenlesens (`architect`, 2026-09-23) klärt der Entwurf die Q13-Unterpunkte, die im Bestell-Durchstich enthalten sind: (a) Weg ohne „Unterwegs" → `handed_over`; (b) „In Küche"/„Fertig" nicht von Hand → bleibt `received`; (g) „quittiert" als Merkmal; (e) Storno-Pfad → jetzt sauber am Merkmal „Zahlung erfasst"; (d) „nie abgeholt" → `ended_unpaid`. Sirat kann Q13 **für den Bestell-Durchstich** schließen, sobald er den reduzierten Weg bestätigt.

**Ausdrücklich NICHT mitgeschlossen — als eigene offene Punkte weiterführen** (sonst wird Q13 fälschlich als erledigt verbucht; `doc-updater` zieht sie in `open-questions.md` nach):

1. **Verhältnis `delivered` ↔ „Abgerechnet"** für Lieferungen ohne erfasste Zahlung — ist `delivered` das Ende oder folgt noch „Abgerechnet"?
2. **„Niemand drückt geliefert":** eine Liefer-Bestellung, bei der niemand „geliefert" auslöst, bliebe für immer in `received`; es braucht einen sichtbaren Abschlussweg am Tagesende (sonst Halden in `received`).
3. **Fahrer-Enden** (Scan lösen, „nicht zustellbar", Bargeld-Kassensturz) — mit dem Fahrer-Teil **zurückgestellt** (ADR 0008), nicht dieses Artefakt.
4. **Lebenszyklus des Restaurants** (in Einrichtung → startklar ↔ gesperrt) — gehört nicht in dieses Bestell-Zustandsmodell, sondern zu **K9 / FA-20 / FA-21**.

Die **fiskalische** Seite von Storno und `ended_unpaid` (Erstattung, Signatur, Teilstorno, DSFinV-K, bis zu welchem Zustand zulässig) bleibt **Q3 (Steuerberaterin)** — unabhängig von Q13.

> **Frage an Sirat / architect (Q13, berührt [FEST 2]):** Ist der reduzierte Piloten-Weg (`received` als einziger Vor-Endzustand, **ohne** `in_kitchen`/`ready`/`out_for_delivery`, mit `handed_over` und `ended_unpaid` als neue Enden) so richtig — und was bedeutet das für die feste Kette aus Briefing §5.3? Vorbereitung durch `architect`, Entscheidung durch Sirat.

> **Frage an Sirat / architect (Q13, Rest-Unterpunkte 1–2):** Gibt es für eine **Lieferung** im Piloten nach `delivered` noch ein „Abgerechnet", obwohl keine Zahlung im System erfasst wird — oder ist `delivered` das Ende? Und was passiert mit einer Liefer-Bestellung, bei der **niemand „geliefert" drückt** (Sichtbarkeit am Tagesende)?

> **Frage an Sirat / architect (Q3):** Ist **„Ohne Bezahlung beendet" (`ended_unpaid`)** ein eigenes Ende oder derselbe **Storno-Pfad** (`cancelled` mit Grund „nie abgeholt")? Beide Muster (Pflichtgrund, Protokoll, Inhaber-Log) sind mechanisch identisch. **Empfehlung des Gegenlesens: eigenes Ende** — „nie abgeholt" ist wirtschaftlich verschieden von Storno (Ware wurde produziert → Schwund, nicht Annullierung), und der append-only Trail ([FEST 7]) soll diese Unterscheidung tragen statt sie in einem Grund-Freitext von `cancelled` zu verstecken (sonst geht Storno-Quote ↔ Schwund-Quote in der Auswertung verloren). Das **eigenständige Ereignis `order.ended_unpaid`** folgt damit bereits aus [FEST 7]; **[VORSCHLAG]** bleibt der eigene **Statuslabel** (Name/Modell entscheidet Sirat, die **fiskalische** Behandlung bleibt Q3).

> **Frage an Sirat / architect (FA-01 9b):** Ist **„Rückruf nötig"** ein Vor-Anlage-Zustand **außerhalb** der Bestell-Zustandsmaschine (Vorschlag oben) oder ein eigener Status `pending_callback` **vor** `received`?

> **Frage an Sirat / architect (ADR 0010):** Ist **„quittiert"** ein **Merkmal** an der Bestellung (Vorschlag oben) oder ein eigener Zustand? Der Entwurf modelliert es als Merkmal, weil der Druck den Bestellstatus nicht ändert.

> **Frage an Steuerberaterin (Q3):** Bis zu welchem Zustand ist ein Storno fiskalisch zulässig, wie läuft er (Erstattung, Signatur, Teilstorno, DSFinV-K)? Ohne diese Antwort bleibt `delivered/handed_over → cancelled` nur auf der Rechte-Seite geklärt.

## Rückverfolgung / Verknüpfungen

- **Prozessschritt (K2, offen):** Anlegen, Bon, Übergabe/Lieferung, Storno.
- **Fachliche Anwendungsfälle:** FA-01/FA-05 (→ `received`), FA-06 (Merkmal „quittiert", Notdruck), FA-11 (`order.amended`, `order.cancelled`, Storno-Pfad), FA-15 (`handed_over`+`paid`, `ended_unpaid`), FA-16 (Abschluss ist Aggregat, **kein** Statuswechsel; Liste nicht kassierter Bestellungen), FA-13/FA-14 (KI-Pause, Papierbetrieb — kein Offline-Nachtrag).
- **Verträge / Events (K6 legt Namen fest):** `order.created`, `order.acknowledged`, `order.printed_unacknowledged` (Notdruck — **eigenes** Ereignis, nicht `acknowledged`), `order.amended`, `order.delivered`, `order.handed_over`, `order.paid` (bzw. `payment.captured` — **entkoppelt** von der Erfüllungskante, an einen Zahlungssatz gebunden), `order.ended_unpaid`, `order.cancelled` — alle append-only.
- **Zahlen (K8):** 2-Minuten-Frist bis Notdruck; Schwelle „Gerät nicht erreichbar → KI-Pause"; Großbestellungs-Schwelle (Artikelanzahl) und Vorlauf.
- **Datenmodell (K5):** Bestellart, Merkmal „quittiert" (3-Wert: unquittiert → quittiert | unquittiert-gedruckt), Merkmal **„Zahlung erfasst"**, Vorbestellung+Wunschzeit, Test-Kennzeichen, Notiz, Teilzahlungen je Zahlart, Grund-Pflichtfeld (ohne Personendaten im Freitext). **Status als String-Literal-Union aus dem Zod-Schema + Textspalte, kein DB-`ENUM`**; „offen/terminal" als abgeleitete Mengen `OPEN_STATES`/`TERMINAL_STATES` an einer Stelle im Kern; die vollen FEST-Zustände bleiben als Zielbild vorgesehen. Für „Rückruf nötig" eine **eigene kleine Tabelle** (`intake_drafts`/`call_handoffs`) mit `tenant_id`+RLS, nicht `orders` (Variante A, [VORSCHLAG]).
- **Testszenarien:** direkt ableitbar — je Übergang ein Normalfall, je Sonderfall ein Grenzfall (Doppelquittierung wirkungslos; Notdruck nach 2 Min; Storno vor/nach Zahlung mit/ohne Grund; Rückwärts-Übergang abgelehnt; Zwei-Tenant-Trennung).

## Nicht Teil dieses Artefakts

- Zustände des **Fahrer-Teils** (`out_for_delivery`, Scan lösen, „nicht zustellbar") → nach dem ersten Piloten (ADR 0008, FA-08/09/10).
- Küchen-Status (`in_kitchen`, `ready`) → entfällt im Piloten (FA-07).
- **Lebenszyklus des Restaurants** (in Einrichtung → startklar ↔ gesperrt) → K9/FA-20/FA-21 (eigenes Zustandsmodell, nicht die Bestellung).
- Fiskalische Übergänge (`fiscal_transactions`: pending/signed/failed) → K5/K6, hängt an Q2.
- Genaue Ereignis-Namen und -Nutzlast → K6; Bon-/Anzeige-Layout → K10; Zahlen → K8.

# K5 · Datenmodell (ER) für den Piloten-Durchstich

- **Status:** Entwurf — Gegenlesen DB + Compliance 2026-09-23 eingearbeitet; Durchgang mit Sirat steht aus; offene Entscheidungen: siehe Fragen · **Paket:** AP-007 · **Skill:** `konzept-diagramme`
- **Zweck:** Zeigt die Tabellen, die der Durchstich **Anruf → Bestellung → Bon (+ Kassieren am Tresen)** braucht, mit ihren Beziehungen. Nur Schlüssel und tragende Felder stehen im Bild; jedes Feld mit Typ, Pflicht und Datenklasse steht im **Datenwörterbuch** ([../vertraege/datenwoerterbuch.md](../vertraege/datenwoerterbuch.md)).
- **Maßgeblich ist die Wort-Tabelle** unter dem Bild. Laufen Bild und Tabelle auseinander, ist das ein Befund.

> **Grenzen dieses Artefakts.** Konzipiert wird nur der Piloten-Durchstich. **Nicht Teil dieses Artefakts** (kommen später, unten als Liste): `drivers`, `driver_shifts`, `payments` (Teilzahlungen je Zahlart), `fiscal_transactions` (TSE), `domains`/Website. Die **Bestellzustände** werden hier **nicht** festgelegt — das macht K3 ([zustand-bestellung.md](zustand-bestellung.md), parallel). `orders.status` und `tenants.status` stehen deshalb nur als **Platzhalter**.
>
> **Regeln, die im ganzen Modell gelten** ([FEST], Briefing §5.2, CLAUDE.md 6/7/8):
> - **Jede Tabelle trägt `tenant_id`** und hat Row-Level-Security (im Bild nur einmal erwähnt, sonst unlesbar). Bei der Übersetzung ist `tenant_id not null references tenants(id)` **und** die RLS-Policy je Tabelle in **derselben** Migration zu setzen — auch für alle Speisekarten-Tabellen (`menu_categories/items/options/variants`), wo `tenant_id` sonst nur per Konvention getragen wäre (DB 1.6).
> - **Zusammengesetzte Fremdschlüssel `(tenant_id, id)`** als Konvention: Jeder Verweis innerhalb eines Tenants (`menu_id`, `category_id`, `item_id`, `order_id`, `customer_id`, `delivery_zone_id`, `shift_id`, `collected_by`, `known_place_id`, `device_id` …) referenziert zusammengesetzt `(tenant_id, id)` auf ein zusammengesetztes Unique/PK der Elterntabelle, damit keine FK-Kette auf einen fremden Tenant zeigt und RLS nicht umgangen wird (Skill `fluvo-multi-tenant`, DB 1.1). Im Bild sind FKs der Lesbarkeit halber einspaltig gezeichnet; maßgeblich ist die zusammengesetzte Form.
> - **Je-Tenant-Eindeutigkeit statt globaler Serials:** `unique (tenant_id, order_number)` mit **je-Tenant-Zähler** (nie globaler Serial — verrät Fremdvolumen; DB 1.2) · `unique (tenant_id)` auf `menus` (DB 1.3) · `unique (tenant_id, idempotency_key)` auf `order_events` (partiell, wo gesetzt) und `voice_calls` (DB 2.2/3.1). **Ausnahme — tenant-agnostische Nachschlagschlüssel**, global eindeutig, weil sie *vor* gesetztem Tenant gelesen werden: `devices.token_hash`, `voice_calls.provider_call_id` und die Zuordnung `phone_numbers`/`voice_agents` (Anbieter-ID → Tenant). Diese Lookups leiten den Tenant ab und betreten dann `withTenant` — **kein `BYPASSRLS`** (DB 1.4/1.5).
> - **Geld immer als Ganzzahl in Cent** (Typname `Cents`). Rundung an **einer** Stelle im Kern, Währung EUR als Annahme (Single-Currency; DB 4.3).
> - **Zeitpunkte in UTC**, Anzeige in der Zeitzone des Restaurants. Diese Zeitzone steht als `tenants.timezone` (IANA, z. B. Europe/Berlin) und trägt jede Tagesgrenze, Öffnungsprüfung, Vorbestellung und den Tagesabschluss (DB 6.1).
> - **`order_events` und Kassendaten sind append-only** — nie `UPDATE`/`DELETE` (GoBD-Audit-Trail). Der Verarbeitungs-/Dispatch-Zustand des In-Process-Verteilers liegt deshalb in einer **eigenen** Tabelle `event_dispatch` (Outbox-Cursor); `order_events` bleibt reines INSERT/SELECT (DB 2.3). `order_events` trägt eine **Sequenz** `seq` je Bestellung, damit die Reihenfolge nie allein an `occurred_at` hängt (DB 2.1).
> - **Kein Audio, kein dauerhaftes Volltranskript**, keine Personendaten in Event-Nutzlasten. Freitextfelder (`note`, `driver_hint`, `cash_settlements.comment`/`discrepancy_reason`, `closures.note`) gelangen **nie** in `order_events`, Logs, Sentry, Fehlermeldungen, URLs oder an den Voice-Anbieter (DB C B4/B10).
> - **Zwei Datenklassen** aus Briefing §5.2, hier um eine dritte (rein betriebliche) ergänzt, damit Stammdaten nicht fälschlich als Buchungsdaten gelten:
>   - **(a) DSGVO-löschbar** — Kundenstamm, Rufnummer, Adresse, Freitext.
>   - **(b) GoBD-pflichtig, 10 Jahre** — Bestellung, Positionen, Events, Kassenabschluss. **Enthält keinen Personenbezug, nur Verweise.**
>   - **(c) betrieblich** — Speisekarte, Zonen, Öffnungszeiten, Geräte. Kein Personenbezug eines Kunden, keine Buchung.
>   - **Löschung = ganze personenbezogene Zeile entfernen, der Beleg bleibt** (Briefing §5.2). Deshalb liegen die personenbezogenen Felder einer Bestellung in einer **eigenen** Tabelle (`order_customer_details`, Klasse a), getrennt von der Bestellung selbst (`orders`, Klasse b). Der Löschweg ist **Zeile löschen** (nicht in-place pseudonymisieren), damit NOT-NULL-Felder konsistent bleiben; `orders.customer_id`-Bezug entfällt mit `ON DELETE SET NULL` (DB 5.2, C-Antwort 2).
>
> **Frage an Sirat / architect (C B1):** Die dritte Datenklasse **(c) betrieblich** weicht von Briefing §5.2 (zwei Klassen) ab; open-questions Q10 hält die Abweichung als „nicht entschieden" fest. Vor der ersten Migration durch `architect` + Sirat freigeben. Die K5-Lesart (c) = Speisekarte/Zonen/Geräte, **ohne** Kundenbezug oder Buchung — nicht zu vermischen mit einem Vorschlag „Kundenstamm/Lieferdaten/Fiskaldaten".

## Die Tabellen in Worten (maßgeblich)

Kurz und in Alltagssprache. `K` = Datenklasse (a/b/c, siehe oben). Details je Feld im Datenwörterbuch.

| Tabelle | Was sie in Alltagssprache ist | K | Herkunft (FA) |
|---|---|---|---|
| `tenants` | Ein Restaurant (Mandant). Trägt Name, gebuchte Module/Minuten (Entitlements), und die Betriebs-Stammdaten, die es nur einmal gibt: welche Zahlungsmöglichkeiten es bei Lieferung gibt, ab welcher Artikelanzahl eine Bestellung eine „Großbestellung" ist, und wie lange Abholung ca. dauert. | c | FA-20/21/22, FA-01, FA-17 |
| `users` | Die Menschen, die im Restaurant arbeiten: Inhaber (meldet sich per E-Mail-Link an) und Annahme-Personal (meldet sich per PIN am registrierten Gerät an). **Beschäftigtendaten** — wird **deaktiviert** (`active=false`), nicht kundengelöscht; ein Klasse-(a)-Löschjob darf `users` nicht erfassen, er läuft tabellen-/regelscharf (C B2). Eigene arbeitsrechtliche Frist → Anwalt A5. | a | FA-19, FA-20, K9 |
| `devices` | Die angemeldeten Geräte des Restaurants: Annahme-Tablet, Drucker, registriertes Inhaber-Handy. `last_seen_at` erlaubt dem Server zu merken, wenn das Annahme-Gerät offline ist (dann pausiert die KI, ADR 0013). | c | FA-14, FA-16, FA-19, FA-20 |
| `menus` | Die eine Speisekarte des Restaurants (genau eine Wahrheit). Trägt eine Versionsnummer, damit KI-Prompt und Offline-Cache wissen, ob sie neu laden müssen. | c | FA-12, [FEST 3/9] |
| `menu_categories` | Die Rubriken der Karte (z. B. „Pizza", „Getränke"). | c | FA-12 |
| `menu_items` | Ein Gericht auf der Karte: Name, Preis (Pflicht — ohne Preis wird nichts angelegt), Steuersatz, Allergene, ob es gerade verfügbar ist („momentan aus"), und ab wann ein geänderter Preis gilt. | c | FA-12 |
| `menu_options` | Bepreiste Extras zu einem Gericht („extra Zwiebeln"). Der Aufpreis **hängt von der Größe/Variante ab** — wie genau das hinterlegt wird, ist **offen** (siehe Fragen). | c | FA-12, FA-01 (Runde 51) |
| `menu_item_variants` | Größen/Varianten eines Gerichts (z. B. „klein"/„groß"). **Nur als Platzhalter — offen**, ob und wie Varianten modelliert werden. | c | FA-12 (Runde 51) — **OFFEN** |
| `delivery_zones` | Die Lieferzonen (als Ortsteile beschrieben). Jede Zone trägt drei Werte: Lieferzeit, Liefergebühr, Mindestbestellwert (auf den Warenwert). Das Modell nutzt **bewusst kein** PostGIS-Polygon: Zuordnung Adresse→Ortsteil per Geocoder (Q6) — begründete Abweichung von der generischen „ST_Contains/GiST"-Regel, konsistent mit FA-17 B18 (Sirats Entscheidung „nicht als gezeichnete Fläche"), kein Versäumnis (DB 8.1). | c | FA-17 |
| `known_delivery_places` | Orte, die Anrufer nennen statt einer Straße („Firma Soundso", „am See wie immer"). Trägt Name, Zone und einen Fahrer-Hinweis. **Kann Personenbezug tragen** (Firmenname, Fahrer-Hinweis) — hat aber **keinen** Rufnummern-Bezug, deshalb müssen Auskunft/Löschung diese Tabelle über Namens-/Freitextsuche ausdrücklich erfassen (C B8). `driver_hint` gelangt nie in Events/Logs/URLs/an den Voice-Anbieter (C B10). Löschfrist/-schlüssel offen → Frage A3 (C B9). | a | FA-24 |
| `opening_hours` | Die Öffnungszeiten je Wochentag — mit **mehreren Zeitfenstern** je Tag (Mittagspause). | c | FA-18 |
| `closures` | Ruhetage, Urlaub, Feiertage und abweichende Einzeltage. | c | FA-18 |
| `acceptance_stops` | Ein von Hand gesetzter Annahmestopp: „keine Lieferung mehr" oder „gar nichts mehr". Endet von Hand, spätestens am Ladenschluss. | c | FA-23 |
| `customers` | Ein Stammkunde eines Restaurants — nur wenn er zugestimmt hat, dass die Adresse gemerkt wird. Schlüssel ist die **E.164-normalisierte** Rufnummer je Restaurant (sonst matchen „030…"/„+49 30…" nicht; C B7, Briefing §6). `last_order_at` steuert die Löschfrist. Der Einwilligungs-Nachweis (auch „Nein" und Widerruf) liegt append-only in `order_events` (siehe unten), nicht nur als Ist-Zustand `consent`. | a | FA-01 (Weg B), FA-02 |
| `customer_addresses` | Die gemerkte(n) Adresse(n) eines Stammkunden, strukturiert (Straße, Hausnummer, PLZ, Ortsteil, Stockwerk) — oder statt einer Adresse ein bekannter Lieferort. | a | FA-01, FA-24 |
| `orders` | Eine Bestellung — **ohne** die personenbezogenen Felder. Trägt Bestellart, Zustand (→ K3), Vorbestellung ja/nein, Zone, die vom Server gerechneten Summen und die Tresen-Barerfassung. `shift_id` und `collected_at` binden das Kassieren an die Schicht, damit der Abschluss je Mitarbeiter ohne Zeitfenster-Join sauber summiert (DB 7.2). Bestellnummer ist je Restaurant eindeutig und wird per Je-Tenant-Zähler vergeben (DB 1.2). Felder für Fahrer und Zahlart sind da, bleiben im Piloten leer (ADR 0008). | b | FA-01, FA-05, FA-11, FA-15 |
| `order_customer_details` | Die personenbezogenen Felder **einer** Bestellung: Name, Rufnummer, Lieferadresse, Notiz. **Getrennt von `orders`**, damit die Löschung (ganze Zeile) genau hier greift und der Beleg bleibt. `contact_phone` kann **ohne** `customers`-Zeile existieren (Kunde sagte „Nein") — Auskunft/Löschung per Rufnummer müssen diese Tabelle direkt erfassen (C B8). `note` gelangt nie in Events/Logs/Sentry/URLs/an den Voice-Anbieter, nur auf Bon und an Küche/Fahrer; die KI erfragt keine Gesundheitsdaten (C B10, → K4). | a | FA-01, FA-05 (Runde 51) |
| `order_items` | Die Positionen einer Bestellung, mit **eingefrorenem** Artikeltext, Einzelpreis, Steuersatz und gewählten Extras. Preis ist **brutto** (Gastro-üblich) und je Position wird der enthaltene Steuerbetrag (`tax_cents`) mitgeführt, damit die USt-Aufteilung je Satz für Beleg/GoBD/DSFinV-K nachrechenbar ist — als **[VORSCHLAG]**, Brutto/Netto-Festlegung ist eine Steuerberaterin-Frage (DB 4.1, S-Frage). `options_snapshot` folgt einem festen Schema (`name`, `surcharge_cents`), damit `line_total = (unit_price + Σ surcharge) × quantity` prüfbar bleibt (DB 4.2). Hängen nie an der aktuellen Karte. | b | FA-01, §5.2 |
| `order_events` | Das unveränderliche Ereignisprotokoll: angelegt, quittiert, geändert, storniert (mit Grund), kassiert, abgeschlossen sowie der **Einwilligungs-Nachweis** (`consent.recorded`/`consent.revoked`, siehe unten). Trägt eine Sequenz `seq` je Bestellung (deterministische Ordnung), einen je Tenant eindeutigen `idempotency_key` (wo gesetzt) und `actor` als reine ID. **Append-only, ohne Personendaten** — der GoBD-Audit-Trail und das Inhaber-Log. Der Verteil-/Dispatch-Zustand liegt getrennt in `event_dispatch`. | b | alle FA, [FEST 7] |
| `event_dispatch` | Der Verarbeitungs-Zustand des In-Process-Verteilers je Event (pending/dispatched). **Getrennt** von `order_events`, weil `fluvo_app` dort nur INSERT/SELECT darf und die Outbox einen Cursor braucht (DB 2.3). | c | K6, [FEST 7] |
| `voice_agents` | Zuordnung Voice-Anbieter-ID / Rufnummer → Restaurant. Der eingehende Voice-Webhook löst darüber den Tenant auf, **bevor** ein `voice_calls`-Satz existiert. Lookup-Schlüssel sind **global eindeutig** und werden tenant-agnostisch gelesen (kein `BYPASSRLS`, DB 1.5). | c | FA-01, `fluvo-multi-tenant` |
| `tenant_health` | Ein Aggregat je Restaurant für die Betreiber-Übersicht (Ampel/Metrik), **ohne** Bestellungen, Kundendaten oder Bestellnummern. Skizze — die Betreiber-Rolle sieht nur diese Projektion, keine Rows aus `orders`/`order_customer_details`/`order_items`/`voice_calls` (C B11, → K9/Q16). | c | FA-22, Briefing §6/§8 |
| `voice_calls` | Was von einem KI-Anruf bleibt: Dauer in Sekunden (fürs Minuten-Metering), Ausgang, ein **eindeutiger** Schlüssel je Anruf (Idempotenz, 13a), die **global eindeutige** `provider_call_id` (Webhook-Zuordnung vor gesetztem Tenant; nie in URLs/Logs). **Kein Audio, kein Transkript, keine Rufnummer.** Aufbewahrungsfrist der Metadaten offen → Frage A6 (C B12). | b | FA-01 (13a), §5.4 |
| `print_jobs` | Ein Bon-Druckauftrag: welche Art (Erst-/geänderter/Nachdruck), welches Exemplar (Station / Fahrer-Kunde / einzeln), Status, wodurch ausgelöst (Quittierung / 2-Minuten-Notdruck / Nachdruck von Hand). Trägt den **Ziel-Drucker** `device_id`, damit das CloudPRNT-Polling je Drucker seine offenen Aufträge filtern kann (DB 7.1); Doppel-Aufträge (Quittierung + Timeout, doppelte Quittierung) sind über Eindeutigkeit/Idempotenz ausgeschlossen (DB 3.3). Ein Nachdruck eines Liefer-Bons nach der Löschung zeigt **ohne** Name/Adresse/Telefon (DB 5.3). | c | FA-06 |
| `staff_shifts` | Die Tresen-Schicht einer Person: Anmeldung am Gerät, offen/geschlossen. Grundlage dafür, dass jedes Kassieren einer Person zugeordnet ist. **Kein Wechselgeld-Start** (ADR 0012). Trägt über `user_id` **Beschäftigtendaten** (Arbeitszeit) — eigene Aufbewahrung, nicht der Kundenlöschung unterworfen (C B3, Frist → Anwalt A5). | c | FA-19 |
| `cash_settlements` | Der Abschluss **je Mitarbeiter** am Tresen: der vom Server gerechnete Soll-Betrag (Summe des bar Kassierten), der gemeldete Betrag mit Pflicht-Kommentar bei Abweichung, die Bestätigung des Inhabers. **Kein Wechselgeld** (ADR 0012). Append-only. `comment`/`discrepancy_reason` sind Belegfreitexte und dürfen **keinen Personenbezug** aufnehmen (C B4); über `user_id` Beschäftigtenbezug (C B3). | b | FA-16 |

## Verknüpfungen (Rückverfolgung)

- **`orders` ↔ K3:** `orders.status` ist der Platzhalter für die Zustandsmaschine (K3, [FEST 4]). Übergänge, benannte Enden („nie abgeholt", „nicht zustellbar") und das Merkmal „quittiert" klärt K3/Q13.
- **`order_events` ↔ K6:** Der Ereignis-Katalog (Namen, Nutzlasten) entsteht in K6. Vorläufige Namen aus den FA: `order.created`, `order.acknowledged`, `order.changed`, `order.cancelled`, `menu.updated`, `counter.shift_settled`, `delivery_place.upserted`, **`consent.recorded`, `consent.revoked`** (Einwilligungs-Nachweis, siehe unten).
- **Einwilligungs-Nachweis ↔ ADR 0007 §K5 / FA-01 T5 (C B5/B6):** Auch ein „Nein" und ein Widerruf werden festgehalten — **append-only** als `order_events`-Ereignis `consent.recorded` (mit **Fragetext-Version**, Antwort **Ja/Nein**, Bezug order/call, `occurred_at`, `actor` — **ohne Name/Rufnummer/Audio**) bzw. `consent.revoked`; Folge des Widerrufs: der Kundeneintrag wird gelöscht. `customers.consent` bleibt nur der Ist-Zustand.
- **`orders`/`order_customer_details` ↔ FA-01/FA-05:** `createOrder` schreibt beide in einer Transaktion und friert `order_items` ein.
- **`voice_calls.idempotency_key` ↔ FA-01 (13a):** ein **eindeutiger** Schlüssel je Anruf; ein Wiederholungsversuch erzeugt keine zweite Bestellung (K6).
- **`cash_settlements` ↔ FA-16/FA-19:** hängt an `staff_shifts`; Soll = Summe der `orders.collected_cash_cents` dieser Person in der Schicht — sauber über `orders.shift_id` (nicht per Zeitfenster-Join; DB 7.2).
- **`event_dispatch` ↔ K6:** Der Verteil-/Verarbeitet-Zustand liegt außerhalb von `order_events`; der Verteiler markiert dort, `order_events` bleibt INSERT/SELECT (DB 2.3).
- **Hintergrund-Jobs ↔ K6 (DB 7.4):** Vorbestellungs-Fälligkeit und Löschfristen laufen als pg-boss-Jobs **ohne Session-Tenant** — der Job iteriert Tenant für Tenant mit `withTenant` (bzw. setzt `tenantId` aus dem Payload), **nie `BYPASSRLS`**. Als Regel in K6 verankern.
- **Mandantentrennung ↔ `fluvo-multi-tenant`:** `tenant_id` auf jeder Tabelle, RLS-Policy je Tabelle in derselben Migration, zusammengesetzte Fremdschlüssel `(tenant_id, …)`, Zwei-Tenant-Test je Route/Abfrage.
- **Betreiber-Sicht ↔ FA-22/K9 (C B11):** Das Aggregat `tenant_health` ist die einzige Betreiber-Quelle; die Betreiber-Rolle hat **keinen** Row-Zugriff auf `orders`/`order_customer_details`/`order_items`/`voice_calls` (→ K9, Q16).

## Nicht Teil dieses Artefakts (kommt später)

Als Verweise mitgedacht, aber **nicht** für den ersten Piloten modelliert:

- `drivers`, `driver_shifts` — Fahrer-Teil als eigene App nach dem Piloten (ADR 0008). Felder `orders.driver_id` und `orders.payment_method` sind schon da, bleiben leer.
- `payments` — allgemeine Teilzahlungen je Zahlart (Karte, online, Fahrer-Bargeld). Im Piloten wird die Tresen-Barzahlung als Felder an `orders` erfasst (`collected_*`); die generische Tabelle kommt mit Karte/Online/Fahrer (Q2, K6).
- `fiscal_transactions` — TSE-Signaturen, DSFinV-K (Q2/Q5/Q11, Steuerberaterin).
- `domains`/Website — Restaurant-Website als eigener Kanal (Briefing §3, später).

## Offene Fragen

> **Frage an Sirat (Options-/Varianten-Modell, FA-12 Runde 51):** Extra-Zutaten sind bepreiste Optionen mit **größen-/variantenabhängigem Aufpreis** (Beispiel: kleine Pizza, extra Zwiebel = 50 Cent). Wie wird das hinterlegt — **eine `menu_item_variants`-Tabelle (Größen)** mit **je Variante eigenem Aufpreis je Extra**, oder eine **Faktor-/Staffelregel**? Davon hängt ab, ob `menu_options.surcharge_cents` ein fester Wert bleibt oder je Variante existiert. → offen, wird in FA-12/K5 vertieft.

> **Frage an den Anwalt (Q10 / A3, C B9): Löschfrist und Datenklasse `known_delivery_places` (FA-24).** Ein bekannter Lieferort kann Personenbezug tragen (Firmenname, Kundenbezeichnung, Fahrer-Hinweis mit Namen) und hat **keinen** Rufnummern-Bezug, an dem ein Löschjob ansetzen könnte. Hier vorläufig **(a)** eingeordnet. Welche Datenklasse und Löschfrist gelten — Stammdaten mit dokumentierter Aufbewahrung oder Nutzungszeitpunkt (`last_used_at`) ergänzen? (In Runde 51 nicht entschieden.)

> **Frage an den Anwalt (Q10 / A4, C B10): Aufbewahrung/Behandlung des Notizfeldes (`order_customer_details.note`).** Freitext an Küche/Fahrer, hier als Personendaten **(a)** an der Bestellung geführt; kann Namen Dritter oder Gesundheitsdaten (Art. 9) enthalten. Wird die Notiz mit dem übrigen Personenbezug nach Frist gelöscht — und genügt bei genannten Gesundheitsdaten die reine Weitergabe an die Küche, während die KI angewiesen ist, solche Angaben **nicht** aktiv zu erfragen (K4)?

> **Frage an den Anwalt (Q10 / A6, C B12): Aufbewahrung `voice_calls`-Metadaten.** Dauer, Ausgang und Schlüssel je Anruf sind für Metering/Abrechnung (b). Wie lange bleiben die personenfreien Anruf-Metadaten? Kein Audio, keine Rufnummer — aber die Frist ist nicht festgelegt (open-questions.md Q10 nennt `voice_calls` ausdrücklich).

> **Frage an den Anwalt (A5, C B3): Aufbewahrung von Beschäftigtendaten** (`users`, `staff_shifts`, `cash_settlements` je Mitarbeiter) — abgegrenzt von der Kundenlöschung (§ 26 BDSG).

> **Frage an Sirat / architect: „Gültig ab"-Preis in der Zukunft (FA-12).** `menu_items.price_valid_from` trägt **einen** Stichtag. Ein **künftig geplanter** Preis (heute alt, ab Datum X neu) braucht entweder eine Preis-Historie/`menu_item_scheduled_prices` oder einen geplanten Änderungssatz. Hier noch nicht modelliert → K5/K6.

> **Frage an die Steuerberaterin (DB 4.1 / S1, ergänzend):** Ist der eingefrorene Positionspreis **brutto** (im Modell als [VORSCHLAG] so gesetzt) und genügt es, den enthaltenen Steuerbetrag je Position (`tax_cents`) zu speichern — oder verlangt DSFinV-K die Netto-Führung bzw. eine andere Aufteilung? Erst nach Antwort wird das [VORSCHLAG] verbindlich; die Zeilen sind danach unveränderlich.

> **Frage an die Steuerberaterin (C B13 / S2):** Darf eine als Test markierte Bestellung (`orders.is_test`) an die TSE, oder muss sie fiskalisch außen vor bleiben? → Q2.

> **Frage an Sirat / architect (C B1):** Freigabe der dritten Datenklasse (c) — siehe Regelblock oben.

> **Modellentscheidung (technisch, [STACK], nicht Produktwahrheit):** Tresen-Barzahlung im Piloten als Felder an `orders` (`collected_by`, `collected_cash_cents`, `collected_voucher_cents`) statt als generische `payments`-Tabelle. Grund: Teilzahlungen je Zahlart, Karte, online und Fahrer kommen erst später (ADR 0008). Ob das so bleibt oder früh auf eine `payments`-Tabelle umgestellt wird, klärt K6 zusammen mit Q2 (Steuerberaterin, DSFinV-K).

# K5 · Datenwörterbuch für den Piloten-Durchstich

- **Status:** Entwurf — Gegenlesen DB + Compliance 2026-09-23 eingearbeitet; Durchgang mit Sirat steht aus; offene Entscheidungen: siehe Fragen · **Paket:** AP-007 · **Skill:** `konzept-vertraege`
- **Zweck:** Je Tabelle jedes Feld mit Typ, Pflicht, **Datenklasse** und Herkunft. Gehört zum ER-Diagramm ([../modelle/er-durchstich.md](../modelle/er-durchstich.md)); dort stehen Beziehungen und Kardinalitäten.
- **Maßgeblich in der Konzeptphase ist diese Datei.** Sobald Code entsteht, wird daraus ein Zod-Schema in `packages/schemas`; ab dann ist das Schema maßgeblich und diese Datei verweist nur darauf. Nie beides pflegen.

## Konventionen

- **Typen (fachlich):** `Kennung` (ID, technisch UUID) · `Text` · `Cents` (Ganzzahl in Cent, [FEST]) · `Zahl` · `Ja/Nein` · `Zeitpunkt` (UTC, [STACK]) · `Datum` · `Uhrzeit` · `Dauer` (Sekunden/Minuten) · `Status-Liste` (String-Literal-Union aus dem Schema, keine freien Strings) · `JSON`.
- **Datenklasse:** **(a)** DSGVO-löschbar · **(b)** GoBD-pflichtig, 10 Jahre, ohne Personenbezug · **(c)** betrieblich. Löschung = **ganze personenbezogene Zeile löschen** (nicht in-place pseudonymisieren), der Beleg (b) bleibt (Briefing §5.2, DB 5.2/C-Antwort 2). **Die dritte Klasse (c) weicht von Briefing §5.2 ab und ist noch nicht freigegeben → Frage an Sirat/architect (C B1), siehe Fragen.**
- **`tenant_id`** (Kennung, Pflicht) trägt **jede** Tabelle mit Verweis auf `tenants(id)`; unten nur dort einzeln genannt, wo es der Klarheit dient. Klasse folgt der Tabelle. Bei der Übersetzung wird `tenant_id not null` **und** die RLS-Policy je Tabelle in **derselben** Migration gesetzt — ausdrücklich auch in `menu_categories/items/options/variants` (DB 1.6).
- **Fremdschlüssel:** Jede `Kennung`, die auf eine andere Tabelle desselben Tenants verweist (`menu_id`, `category_id`, `item_id`, `order_id`, `customer_id`, `zone_id`, `shift_id`, `device_id`, `collected_by`, `known_place_id` …), referenziert **zusammengesetzt `(tenant_id, id)`** auf ein zusammengesetztes Unique/PK der Elterntabelle (Skill `fluvo-multi-tenant`, DB 1.1). Ausnahme: die tenant-agnostischen Lookup-Schlüssel (`devices.token_hash`, `voice_calls.provider_call_id`, `voice_agents`), die **global** eindeutig sind (DB 1.4/1.5).
- **Geld:** `Cents` (Ganzzahl). Rundung an **einer** Stelle im Kern; Währung EUR als Annahme (Single-Currency, DB 4.3).
- **Bestellzustände** werden hier **nicht** festgelegt — `orders.status` und `tenants.status` sind Platzhalter, Verweis auf **K3** ([../modelle/zustand-bestellung.md](../modelle/zustand-bestellung.md)).
- **Konkrete Löschfristen:** [OFFEN] Q10 (Anwalt). Vorläufig genannte Werte (z. B. 12 Monate) stehen unter Vorbehalt.

Diese Punkte brauchen eine **neue Entscheidung** (Sirat, architect, Anwalt oder Steuerberaterin) und werden hier **nicht** entschieden. Verweise auf die Befund-Nummern der Gegenlese-Berichte (DB … / C …).

> **Frage an Sirat / architect (C B1):** Freigabe der **dritten Datenklasse (c) betrieblich**, die von Briefing §5.2 (zwei Klassen) abweicht (open-questions Q10, „nicht entschieden"). Vor der ersten Migration. K5-Lesart (c) = Speisekarte/Zonen/Geräte, ohne Kundenbezug/Buchung.

> **Frage an Sirat (Options-/Varianten-Modell, FA-12 Runde 51, DB 9 / Q26):** Wie wird der **größen-/variantenabhängige Aufpreis** einer Extra-Zutat hinterlegt — `menu_item_variants` mit je Variante eigenem Aufpreis, oder eine Regel/Staffel? Betrifft `menu_options.surcharge_cents` und `menu_item_variants` (heute Platzhalter). **Bleibt offen (Q26)** — bis dahin `order_items.options_snapshot` nicht auf eine unklare Struktur einfrieren.

> **Frage an den Anwalt (C B9 / A3):** Löschfrist und endgültige Datenklasse für **`known_delivery_places`** (kann Personenbezug tragen, kein Rufnummern-Bezug).

> **Frage an den Anwalt (C B10 / A4):** Behandlung des **Notizfeldes** `order_customer_details.note`, wenn ein Anrufer von sich aus Gesundheitsdaten (Art. 9) nennt.

> **Frage an den Anwalt (C B12 / A6):** **Aufbewahrungsfrist der personenfreien `voice_calls`-Metadaten** (open-questions.md Q10 nennt sie ausdrücklich).

> **Frage an den Anwalt (C B3 / A5):** Aufbewahrung der **Beschäftigtendaten** (`users`, `staff_shifts`, `cash_settlements` je Mitarbeiter), abgegrenzt von der Kundenlöschung.

> **Frage an die Steuerberaterin (DB 4.1 / S1):** Ist der eingefrorene Positionspreis **brutto** (im Modell [VORSCHLAG]) und genügt der gespeicherte `tax_cents` je Position, oder verlangt DSFinV-K eine andere Netto-/Steuer-Führung? (Vor der ersten unveränderlichen `order_items`-Zeile.)

> **Frage an die Steuerberaterin (C B13 / S2):** Darf eine als Test markierte Bestellung (`orders.is_test`) an die TSE, oder muss sie fiskalisch außen vor bleiben? (Q2)

> **Frage an die Steuerberaterin (C B4 / S3):** Sind die Freitextfelder des Tresen-Abschlusses (`comment`, `discrepancy_reason`) fiskalisch aufbewahrungspflichtig — und dürfen/sollen sie personenbezugsfrei gehalten werden?

> **Frage an Sirat / architect:** Wie werden **künftig geplante Preise** („gültig ab" in der Zukunft) gespeichert — Preis-Historie/`menu_item_scheduled_prices` oder geplanter Änderungssatz? `menu_items.price_valid_from` trägt nur einen Stichtag.

> **Frage an die Steuerberaterin (Q2):** Darf `cash_settlements`/`orders.collected_*` Barzahlungen aufzeichnen, während beim Piloten daneben eine TSE-Kasse läuft — und braucht die Tresen-Erfassung selbst eine TSE (dann `fiscal_transactions` früher)? Ohne Antwort bleibt der Weg über `payments`/`fiscal_transactions` offen.

## Fragen zur Weiterleitung (Anwalt / Steuerberaterin)

Aus dem Compliance-Bericht (2026-09-23), fertig formuliert. Verknüpft mit den Befunden oben.

**An den Anwalt (Q10):**

- **A1** (C B5/B6): Trägt die telefonische Einwilligung „Adresse merken?" als Rechtsgrundlage für einen dauerhaften Kundeneintrag (Rufnummer, Name, Adresse), und genügt ein **append-only Protokolleintrag** (Zeitpunkt, Fragetext-Version, Antwort Ja/Nein, ohne Audio) als Nachweis nach Art. 7 Abs. 1 DSGVO?
- **A2** (`customers.last_order_at`): Ist eine Löschfrist von **12 Monaten** nach der letzten Bestellung für den Kundenstamm angemessen?

- **A5** (C B3): Welche **Aufbewahrung** gilt für Beschäftigtendaten (Personal, Schichten, Abschlüsse je Mitarbeiter) — abgegrenzt von der Kundenlöschung?
- **A6** (C B12): Wie lange dürfen/müssen **personenfreie Anruf-Metadaten** (Dauer, Zeitpunkt, Ausgang) aufbewahrt werden?

**An die Steuerberaterin (Q2), ergänzend:**

- **S1** (DB 4.1): Muss der GoBD-Beleg nach Löschung der Personendaten **Summe, Positionen, Zeitpunkt, Zahlart und Bestellnummer** zwingend behalten (so modelliert), oder werden weitere Angaben verlangt — und ist die Brutto-Führung mit `tax_cents` je Position ausreichend?
- **S2** (C B13): Darf eine als **Test** markierte Bestellung an die TSE, oder muss sie fiskalisch außen vor bleiben?
